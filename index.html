<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#D4AF37;--gl:#EDD77A;--gd:#B8962E;--bg:#0F172A;--s1:#111827;--s2:#1F2937;--s3:#374151;--bo:#2D3748;--tx:#E5E7EB;--mu:#94A3B8;--hi:#334155;--ok:#4caf7d;--er:#e05252;--wa:#f0a030;--in:#3B82F6;--r:7px;--r2:4px;--sw:224px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--s1)}::-webkit-scrollbar-thumb{background:var(--gd);border-radius:3px}
#shell{display:flex;height:100vh;overflow:hidden}
#sb{width:var(--sw);background:var(--s1);border-right:1px solid var(--bo);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sbl{padding:14px 12px 10px;border-bottom:1px solid var(--bo);text-align:center}
.sbl .gem{font-size:20px;display:block;margin-bottom:2px}.sbl .sn{font-size:.88rem;font-weight:700;color:var(--gold);letter-spacing:1px}.sbl .ss{font-size:.62rem;color:var(--hi);margin-top:1px}
.snav{flex:1;padding:4px 0}.ssec{font-size:.58rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--hi);padding:8px 12px 2px}
.ni{display:flex;align-items:center;gap:7px;padding:6px 12px;color:var(--mu);cursor:pointer;border-left:3px solid transparent;transition:all .12s;font-size:.78rem;user-select:none}
.ni:hover{background:var(--s2);color:var(--tx)}.ni.on{background:rgba(212,175,55,.09);color:var(--gold);border-left-color:var(--gold)}.ni .ic{width:15px;text-align:center;flex-shrink:0;font-size:11px}
.sbf{padding:9px 11px;border-top:1px solid var(--bo)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tb{height:50px;background:var(--s1);border-bottom:1px solid var(--bo);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.rchips{display:flex;gap:8px;align-items:center}
.chip{background:var(--s2);border:1px solid var(--bo);border-radius:20px;padding:3px 10px;font-size:.72rem;display:flex;gap:4px;align-items:center}
.chip .cl{color:var(--mu)}.chip .cv{color:var(--gold);font-weight:600}
#clk{font-size:.72rem;color:var(--mu)}
#pg{flex:1;overflow-y:auto;padding:18px}
.ph{margin-bottom:14px}.ph h1{font-size:1.15rem;color:var(--gold);font-weight:600}.ph p{color:var(--mu);font-size:.76rem;margin-top:2px}
.card{background:var(--s1);border:1px solid var(--bo);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ct{font-size:.83rem;color:var(--gl);font-weight:600;margin-bottom:10px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:12px}
.kc{background:var(--s1);border:1px solid var(--bo);border-radius:var(--r);padding:11px}.kc.gb{border-color:var(--gd)}
.kl{font-size:.63rem;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.kv{font-size:1.15rem;font-weight:700;color:var(--gold)}.ks{font-size:.68rem;color:var(--mu);margin-top:2px}
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.fg label{font-size:.65rem;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{background:var(--s2);border:1px solid var(--bo);border-radius:var(--r2);color:var(--tx);padding:6px 9px;font-size:.8rem;font-family:inherit;width:100%;outline:none;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}select option{background:var(--s2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px}
.cb{background:var(--s3);border:1px solid var(--gd);border-radius:var(--r2);padding:7px 11px;font-size:.88rem;color:var(--gold);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 13px;border-radius:var(--r2);border:none;cursor:pointer;font-size:.78rem;font-weight:600;font-family:inherit;transition:all .12s;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bp{background:var(--gold);color:#000}.bp:hover:not(:disabled){background:var(--gl)}
.bs{background:var(--s3);color:var(--tx);border:1px solid var(--bo)}.bs:hover:not(:disabled){border-color:var(--gd)}
.bd{background:var(--er);color:#fff}.bg2{background:transparent;color:var(--gold);border:1px solid var(--gd)}.bg2:hover:not(:disabled){background:rgba(212,175,55,.10)}
.bsm{padding:3px 9px;font-size:.7rem}.bfull{width:100%}
.fa{display:flex;gap:7px;align-items:center;margin-top:5px}
.tw{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:.76rem}
.dt th{background:var(--s2);color:var(--mu);font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;padding:7px 9px;text-align:left;border-bottom:1px solid var(--bo);white-space:nowrap}
.dt td{padding:6px 9px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.dt tr:last-child td{border:none}.dt tr:hover td{background:rgba(212,175,55,.04)}
.b2{display:inline-block;padding:2px 6px;border-radius:9px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.bsc{background:rgba(76,175,125,.15);color:var(--ok)}.ber{background:rgba(224,82,82,.15);color:var(--er)}.bwr{background:rgba(240,160,48,.15);color:var(--wa)}.bin{background:rgba(59,130,246,.15);color:var(--in)}.bgo{background:rgba(212,175,55,.15);color:var(--gold)}.bmu{background:var(--s3);color:var(--mu)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bo);margin-bottom:14px}
.tb{padding:6px 13px;background:none;border:none;border-bottom:2px solid transparent;color:var(--mu);cursor:pointer;font-size:.78rem;font-family:inherit;margin-bottom:-1px;transition:all .12s}
.tb.on{color:var(--gold);border-bottom-color:var(--gold)}.tp{display:none}.tp.on{display:block}
.al{padding:9px 13px;border-radius:var(--r2);margin-bottom:10px;font-size:.78rem;border-left:3px solid;display:flex;gap:7px;align-items:flex-start}
.aw{background:rgba(240,160,48,.08);border-color:var(--wa);color:var(--wa)}.ae{background:rgba(224,82,82,.08);border-color:var(--er);color:var(--er)}.aok{background:rgba(76,175,125,.08);border-color:var(--ok);color:var(--ok)}.ai{background:rgba(59,130,246,.08);border-color:var(--in);color:var(--in)}
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:999;align-items:center;justify-content:center;padding:14px}
.mb{background:var(--s1);border:1px solid var(--bo);border-radius:var(--r);width:100%;max-width:620px;max-height:93vh;overflow-y:auto}
.mh{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--bo)}
.mh h3{color:var(--gold);font-size:.88rem}.mc{padding:15px}.mf{padding:13px 15px;border-top:1px solid var(--bo);display:flex;gap:7px;justify-content:flex-end}
#toast{position:fixed;bottom:18px;right:18px;z-index:9999;font-size:.8rem;font-weight:500;padding:9px 15px;border-radius:var(--r2);opacity:0;transition:opacity .25s;pointer-events:none;max-width:320px;border:1px solid transparent}
.sep{height:1px;background:var(--bo);margin:10px 0}
.empty{text-align:center;padding:32px 14px;color:var(--hi)}.empty .ei{font-size:1.8rem;opacity:.3;margin-bottom:7px}
.tg{display:inline-block;background:var(--s3);color:var(--mu);border-radius:3px;padding:1px 5px;font-size:.7rem}
.tgo{color:var(--gold);font-weight:600}.tm{color:var(--mu)}.tsc{color:var(--ok)}.ter{color:var(--er)}.twa{color:var(--wa)}.fw{font-weight:600}
.row{display:flex;align-items:center;gap:9px}.jb{justify-content:space-between}
.bi{background:var(--s2);border:1px solid var(--bo);border-radius:var(--r2);padding:9px 11px;margin-bottom:7px}
.bih{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.srw{position:relative}.srd{position:absolute;top:100%;left:0;right:0;background:var(--s2);border:1px solid var(--bo);border-radius:var(--r2);z-index:200;max-height:200px;overflow-y:auto;display:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.srd.open{display:block}.sri{padding:6px 11px;cursor:pointer;font-size:.8rem}.sri:hover{background:var(--s3)}
.irow{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border:1px solid var(--bo);border-radius:var(--r2);margin-bottom:4px;transition:border-color .12s}
.irow:hover{border-color:var(--gd)}.irow.sel{border-color:var(--gold);background:rgba(212,175,55,.06)}
.sbox{background:var(--s2);border:1px solid var(--gd);border-radius:var(--r);padding:11px 13px}
.sr2{display:flex;justify-content:space-between;padding:3px 0;font-size:.8rem}
.sr2.tot{border-top:1px solid var(--bo);margin-top:5px;padding-top:7px;font-size:.88rem;font-weight:600;color:var(--gold)}
.cf-in{color:var(--ok)}.cf-out{color:var(--er)}
.btag{background:rgba(91,155,240,.15);color:var(--in);border-radius:3px;padding:1px 5px;font-size:.65rem;font-weight:700}
.cal{background:var(--s2);border:1px solid var(--bo);border-radius:var(--r2);padding:7px 11px;margin-bottom:6px;font-size:.76rem;border-left:3px solid}
.cal.ov{border-left-color:var(--er)}.cal.dt2{border-left-color:var(--wa)}.cal.ds{border-left-color:#f0c830}
.inv-row{background:var(--s2);border:1px solid var(--bo);border-radius:var(--r2);padding:10px 13px;margin-bottom:7px;transition:border-color .15s}
.inv-row:hover{border-color:var(--gd)}
#ls{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.08) 0%,transparent 60%),var(--bg)}
.lc{background:var(--s1);border:1px solid var(--gold);border-radius:10px;padding:34px 30px;width:310px;text-align:center;box-shadow:0 0 50px rgba(212,175,55,.15)}
.lg{font-size:2.6rem;margin-bottom:7px}.ln{font-family:Georgia,serif;font-size:1.35rem;color:var(--gold);font-weight:700;letter-spacing:2px}
.la{font-size:.68rem;color:var(--hi);margin-top:3px;margin-bottom:22px}.lf{text-align:left}.le{color:var(--er);font-size:.72rem;margin-bottom:7px;display:none}
.lfo{margin-top:14px;font-size:.62rem;color:var(--hi);letter-spacing:.5px}
@media print{#sb,#tb,.no-print{display:none!important}#main{margin:0}#pg{overflow:visible;padding:0}body{background:#fff;color:#000;overflow:visible}.card{border:1px solid #ccc;background:#fff}}

/* ═══ MOBILE RESPONSIVE ════════════════════════════════════════ */
#mobHam{display:none}
#sbOv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:998}
#bnav{display:none}

@media(max-width:768px){
  body{overflow:auto;font-size:14px}
  #shell{flex-direction:column;height:auto;min-height:100vh;overflow:auto}

  /* Sidebar — full-screen slide-in overlay on mobile */
  #sb{position:fixed;top:0;left:0;bottom:0;z-index:999;width:82vw;max-width:300px;transform:translateX(-105%);transition:transform .26s cubic-bezier(.4,0,.2,1);overflow-y:auto;height:100vh}
  #sb.mob-open{transform:translateX(0);box-shadow:4px 0 32px rgba(0,0,0,.7)}
  #sbOv{display:none}
  #sbOv.open{display:block}

  /* Top bar — compact */
  #main{width:100%;display:flex;flex-direction:column}
  #tb{height:auto;padding:7px 10px;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:100;min-height:48px}
  #mobHam{display:flex;background:var(--s3);border:1px solid var(--bo);color:var(--tx);border-radius:5px;padding:5px 9px;font-size:1rem;cursor:pointer;flex-shrink:0;align-items:center;justify-content:center;margin-right:4px}
  .rchips{flex:1;gap:4px;flex-wrap:wrap}
  .chip{padding:3px 7px;font-size:.62rem}
  #clk{display:none}
  #privBtn{font-size:.65rem;padding:4px 8px}

  /* Content area */
  #pg{padding:10px;padding-bottom:72px}

  /* All inline grid layouts → single column */
  #pg [style*="grid-template-columns"]{grid-template-columns:1fr!important}
  #pg [style*="display:grid"]{grid-template-columns:1fr!important}
  .g2,.g3,.g4{grid-template-columns:1fr!important}
  /* KPI cards stay 2-col on mobile (they're small) */
  .kg{grid-template-columns:repeat(2,1fr)!important}

  /* Cards */
  .card{padding:11px;margin-bottom:9px}

  /* Tables — horizontal scroll with touch momentum */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
  .dt{min-width:520px;font-size:.72rem}
  .dt th{font-size:.58rem;padding:6px 7px}
  .dt td{padding:5px 7px}

  /* Bigger touch targets */
  .btn{padding:9px 14px;font-size:.8rem}
  .bsm{padding:6px 11px;font-size:.72rem}
  .bfull{padding:11px 14px;font-size:.86rem}
  input,select,textarea{padding:9px 10px;font-size:.88rem}
  .ni{padding:10px 14px;font-size:.82rem}
  .ssec{padding:10px 14px 3px}

  /* Modal — bottom sheet style */
  #mo{padding:0;align-items:flex-end}
  .mb{max-width:100%!important;width:100%!important;max-height:90vh;border-radius:16px 16px 0 0;border-bottom:none}

  /* Login screen */
  .lc{width:92vw;padding:24px 16px}
  .lc .ln{font-size:1.15rem}
  .lc .lg{font-size:2rem}

  /* Tabs — scrollable */
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;gap:0}
  .tb{white-space:nowrap;padding:8px 12px;font-size:.75rem}

  /* Page header */
  .ph h1{font-size:1rem}
  .ph p{font-size:.72rem}

  /* KPI card values */
  .kv{font-size:.95rem}
  .kl{font-size:.58rem}

  /* Summary boxes */
  .sbox{font-size:.82rem}
  .sr2{font-size:.78rem}

  /* Alert boxes */
  .al{font-size:.76rem;padding:8px 11px}

  /* Backup banner — full width */
  #bkBanner{left:0!important;font-size:.72rem}

  /* Invoice rows */
  .inv-row{padding:9px 10px}

  /* Row → column on small screens for form+table patterns */
  .row{flex-wrap:wrap;gap:6px}
  .fa{flex-wrap:wrap}

  /* Print button hidden on mobile */
  .no-print{display:inline-flex}

  /* ═══ BOTTOM QUICK-NAV ═════════════════════════════════════ */
  #bnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--s1);border-top:1px solid var(--bo);
    z-index:997;padding:0;height:58px;
    box-shadow:0 -4px 16px rgba(0,0,0,.4)
  }
  .bni{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;cursor:pointer;padding:4px 2px;
    color:var(--mu);font-size:.55rem;font-weight:600;
    border:none;background:transparent;letter-spacing:.3px;
    -webkit-tap-highlight-color:transparent;transition:color .12s
  }
  .bni .bic{font-size:1.2rem;line-height:1}
  .bni:active,.bni.on{color:var(--gold)}
  .bni.on .bic{filter:drop-shadow(0 0 4px rgba(212,175,55,.6))}
  .bni-sep{width:1px;background:var(--bo);flex-shrink:0}
}

@media(max-width:360px){
  .chip .cl{display:none}
  .chip{padding:3px 6px}
  .bni{font-size:.5rem}
  .bni .bic{font-size:1.05rem}
}
</style>
  <!-- JsBarcode for Code-128 labels -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
  <style>
    /* Label print CSS */
    @media print {
      body > *:not(#labelPrintArea) { display:none!important; }
      #labelPrintArea { display:block!important; }
    }
    #labelPrintArea { display:none; }
    .label-front, .label-back {
      display:inline-block;
      border:1px solid #ccc;
      box-sizing:border-box;
      page-break-inside:avoid;
      vertical-align:top;
      font-family:'Arial',sans-serif;
    }
    .label-pair { display:inline-block; margin:2mm; vertical-align:top; }
    @page { margin:3mm; }
  </style>
</head>
<body>
<div id="ls">
  <div class="lc">
    <div class="lg">💎</div>
    <div class="ln">TAJ JEWELLERY</div>
    <div class="la">Railway Kodur, Tirupathi, AP</div>
    <div class="lf">
      <div class="fg"><label>Role</label><select id="lRole">
        <option value="owner">👑 Owner (Full Access)</option>
        <option value="staff">🧑 Staff (Sales Only)</option>
      </select></div>
      <div class="fg"><label>Password</label><input type="password" id="lp" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"></div>

      <button class="btn bp bfull" onclick="doLogin()">Sign In</button>

</div>
<div id="shell" style="display:none">
  <!-- Mobile sidebar overlay backdrop -->
  <div id="sbOv" onclick="closeMobSB()"></div>
  <aside id="sb"></aside>
  <div id="main">
    <div id="tb">
      <div class="rchips">
        <!-- Hamburger — visible only on mobile -->
        <button id="mobHam" onclick="toggleMobSB()" aria-label="Menu">☰</button>

      <span class="bic">🏦</span>REGISTER
    </button>

      <span class="bic">📦</span>STOCK
    </button>
  </nav>
</div>
<div id="mo" style="display:none;position:fixed"><div class="mb" id="mb"></div></div>

<script>
'use strict';
// ═══ STATE ═══════════════════════════════════════════════════
const DEF={rates:{},products:{},items:{},vendors:{},customers:{},invoices:{},
  // vendorLedgers: keyed by vendorId. Each has cash & pure gold/silver running ledger
  vendorLedgers:{},
  customerCredits:[],expenses:[],oldGold:[],salesReturns:[],purchaseReturns:[],cashReg:{},counters:{},
  // All payment flows now carry {id,date,amount,mode} where mode=cash|upi|card|cheque
  allFlowsIn:[],   // every money-in event: {id,date,amount,mode,type,desc}
  allFlowsOut:[],  // every money-out event: {id,date,amount,mode,type,desc}
  salesReturnRefunds:[],oldGoldCashOuts:[],oldGoldCashIns:[],exchangeCashFlows:[],
  weightThresholds:{},
  settings:{shopName:'TAJ JEWELLERY',phone:'9848083541',address:'Opp. Vegetable Market, Sivalayam St, Railway Kodur, Tirupathi, AP - 516101',gstNo:'',password:'TAJSHoP9848',staffPassword:'TAj984',logoUrl:'',labelWidth:50,labelHeight:25}};
let S=JSON.parse(JSON.stringify(DEF));
try{
  const d=localStorage.getItem('taj_final');
  if(d){
    const p=JSON.parse(d);
    Object.keys(p).forEach(k=>{
      if(k==='settings'&&typeof p[k]==='object'&&typeof S[k]==='object'){
        Object.keys(p[k]).forEach(sk=>{S[k][sk]=p[k][sk];});
        Object.keys(DEF[k]).forEach(sk=>{if(S[k][sk]===undefined)S[k][sk]=DEF[k][sk];});
      }else{S[k]=p[k];}
    });
  }
}catch(e){}

// Returns true if entry is within 24 hours of entryTs
function within24hr(entryTs){
  if(!entryTs)return false;
  const now=new Date(),entry=new Date(entryTs);
  return(now-entry)<(24*60*60*1000);
}
// Returns a delete button HTML if within 24hrs and owner
function delBtn24(type,id,label){
  if(currentRole!=='owner')return '';
  return`<button class="btn bd bsm" style="padding:3px 8px;font-size:.66rem" onclick="del24('${type}','${id}','${label}')">🗑️</button>`;
}
// Universal 24hr delete handler
function del24(type,id,label){
  if(currentRole!=='owner')return toast('Owner access required','err');
  const handlers={
    item:()=>{
      const it=S.items[id];
      if(!it)return toast('Not found','err');
      if(!within24hr(it.entryTs))return toast('Cannot delete — 24hr window passed','err');
      if(it.status!=='Available')return toast('Cannot delete — item already sold','err');
      delete S.items[id];save();toast('🗑️ Item deleted');
      if(cur==='purchase')PAGES['purchase']();
      else if(cur==='opening-stock')PAGES['opening-stock']();
    },
    invoice:()=>{
      const inv=S.invoices[id];
      if(!inv)return toast('Not found','err');
      if(!within24hr(inv.entryTs))return toast('Cannot delete — 24hr window passed','err');
      if(inv.status==='returned')return toast('Cannot delete returned invoice','err');
      // ✅ Restore item status back to Available
      (inv.items||[]).forEach(it=>{
        if(S.items[it.itemId]){
          S.items[it.itemId].status='Available';
          S.items[it.itemId].invoiceId=null;
          // Restore bulk weight
          if(S.items[it.itemId].isBulk){
            S.items[it.itemId].remainingWeight=(S.items[it.itemId].remainingWeight||0)+(it.weight||0);
          }
        }
      });
      // ✅ Reverse ALL cash flows linked to this invoice
      // Remove payment flowIns (cash, upi, card, cheque)
      const pay=inv.paymentBreakdown||{};
      ['cash','upi','card','cheque'].forEach(mode=>{
        if(pay[mode]>0){
          // Remove the matching flowIn by amount+mode+date
          let removed=false;
          S.allFlowsIn=S.allFlowsIn.filter(f=>{
            if(!removed&&f.date===inv.date&&f.mode===mode&&Math.abs(f.amount-pay[mode])<0.01){removed=true;return false;}
            return true;
          });
        }
      });
      // ✅ Reverse exchange gold flowIn if any
      if(inv.isExchange&&inv.exchangeOldGoldValue>0){
        let removed=false;
        S.allFlowsIn=S.allFlowsIn.filter(f=>{
          if(!removed&&f.date===inv.date&&f.type==='exchange_buy'&&Math.abs(f.amount-inv.exchangeOldGoldValue)<0.01){removed=true;return false;}
          return true;
        });
        // Remove old gold entry created during exchange
        S.oldGold=S.oldGold.filter(og=>og.exchangeInvoiceId!==id);
        if(S.oldSilverPool)S.oldSilverPool=S.oldSilverPool.filter(sp=>sp.exchangeInvoiceId!==id);
      }
      // ✅ Restore customer credit if credit sale
      if(inv.creditAmount>0&&inv.customerId&&S.customers[inv.customerId]){
        S.customers[inv.customerId].creditDue=Math.max(0,(S.customers[inv.customerId].creditDue||0)-inv.creditAmount);
        // Remove customer credit record
        S.customerCredits=(S.customerCredits||[]).filter(c=>c.invoiceId!==id);
      }
      // ✅ Restore customer total purchases
      if(inv.customerId&&S.customers[inv.customerId]){
        S.customers[inv.customerId].totalPurchases=Math.max(0,(S.customers[inv.customerId].totalPurchases||0)-(inv.netPayable||inv.received||0));
      }
      delete S.invoices[id];save();
      toast('🗑️ Invoice deleted — stock restored, cash register reversed, customer balance updated');
      PAGES['invoice-history']();
    },
    expense:()=>{
      const idx=S.expenses.findIndex(e=>e.id===id);
      if(idx<0)return toast('Not found','err');
      if(!within24hr(S.expenses[idx].entryTs))return toast('Cannot delete — 24hr window passed','err');
      // ✅ Expense is read directly by calcCash — removing it auto-reverses register
      S.expenses.splice(idx,1);save();
      toast('🗑️ Expense deleted — cash register restored');
      PAGES['expenses']();
    },
    oldgold:()=>{
      const idx=S.oldGold.findIndex(e=>e.oldGoldId===id);
      if(idx<0)return toast('Not found','err');
      const og=S.oldGold[idx];
      if(!within24hr(og.entryTs))return toast('Cannot delete — 24hr window passed','err');
      if(og.status==='sold')return toast('Cannot delete — already sold','err');
      // ✅ Reverse cash flowOut (money paid to customer when buying)
      if(og.pricePaid>0){
        let removed=false;
        S.allFlowsOut=S.allFlowsOut.filter(f=>{
          if(!removed&&f.type==='old_gold_buy'&&f.date===og.date&&Math.abs(f.amount-og.pricePaid)<0.01){removed=true;return false;}
          return true;
        });
      }
      S.oldGold.splice(idx,1);save();
      toast('🗑️ Old gold entry deleted — cash register restored');
      PAGES['old-gold']();
    },
    silver:()=>{
      const idx=(S.oldSilverPool||[]).findIndex(e=>e.id===id);
      if(idx<0)return toast('Not found','err');
      const sp=S.oldSilverPool[idx];
      if(!within24hr(sp.entryTs))return toast('Cannot delete — 24hr window passed','err');
      if(sp.status==='given')return toast('Cannot delete — already given to vendor','err');
      // ✅ Reverse cash flowOut (money paid to customer when buying silver directly)
      // Exchange silver has no cash flow — source='exchange' means no flowOut was made
      if(sp.sourceType!=='exchange'&&sp.agreedValue>0){
        let removed=false;
        S.allFlowsOut=S.allFlowsOut.filter(f=>{
          if(!removed&&f.type==='old_silver_buy'&&f.date===sp.date&&Math.abs(f.amount-sp.agreedValue)<0.01){removed=true;return false;}
          return true;
        });
      }
      S.oldSilverPool.splice(idx,1);save();
      toast('🗑️ Silver pool entry deleted — cash register restored');
      PAGES['old-silver']();
    },
    advance:()=>{
      const idx=(S.advances||[]).findIndex(e=>e.id===id);
      if(idx<0)return toast('Not found','err');
      const adv=S.advances[idx];
      if(!within24hr(adv.entryTs))return toast('Cannot delete — 24hr window passed','err');
      if(adv.adjustedInInvoice)return toast('Cannot delete — linked to invoice. Delete invoice first.','err');
      // ✅ Reverse flowIn (cash received as advance)
      if(adv.amount>0){
        let removed=false;
        S.allFlowsIn=S.allFlowsIn.filter(f=>{
          if(!removed&&(f.type==='advance_token'||f.type==='advance_order')&&f.date===adv.date&&Math.abs(f.amount-adv.amount)<0.01){removed=true;return false;}
          return true;
        });
      }
      S.advances.splice(idx,1);save();
      toast('🗑️ Advance deleted — cash register restored');
      PAGES['advances']();
    },
    scheme:()=>{
      const idx=(S.goldSchemes||[]).findIndex(e=>e.id===id);
      if(idx<0)return toast('Not found','err');
      const sc=S.goldSchemes[idx];
      if(!within24hr(sc.entryTs))return toast('Cannot delete — 24hr window passed','err');
      if(sc.status==='redeemed')return toast('Cannot delete — scheme already redeemed','err');
      // ✅ Reverse ALL monthly collection flowIns for this scheme
      S.allFlowsIn=S.allFlowsIn.filter(f=>!(f.type==='scheme_collection'&&f.desc&&f.desc.startsWith(id)));
      S.goldSchemes.splice(idx,1);save();
      toast('🗑️ Scheme deleted — all monthly collections reversed in register');
      PAGES['gold-scheme']();
    },
    purchase:()=>{
      const it=S.items[id];
      if(!it)return toast('Not found','err');
      if(!within24hr(it.entryTs))return toast('Cannot delete — 24hr window passed','err');
      if(it.status!=='Available')return toast('Cannot delete — item already sold','err');
      // ✅ Reverse spot flowOut
      if(it.payType==='spot'){
        let removed=false;
        S.allFlowsOut=S.allFlowsOut.filter(f=>{
          if(!removed&&(f.type==='spot_purchase'||f.type==='gst_purchase')&&f.date===it.entryDate&&f.desc&&f.desc.includes(id)){removed=true;return false;}
          return true;
        });
      }
      // ✅ Reverse vendor ledger entries (cash credit or pure credit)
      if(it.payType==='cash_credit'&&it.vendorId){
        const vl=getVL(it.vendorId);
        vl.cashEntries=vl.cashEntries.filter(e=>!e.note||!e.note.includes(id));
      }
      if(it.payType==='pure_credit'&&it.vendorId){
        const vl=getVL(it.vendorId);
        vl.goldEntries=vl.goldEntries.filter(e=>!e.note||!e.note.includes(id));
        vl.silverEntries=vl.silverEntries.filter(e=>!e.note||!e.note.includes(id));
      }
      delete S.items[id];save();
      toast('🗑️ Purchase deleted — cash register and vendor ledger reversed');
      PAGES['purchase']();
    }
  };
  const fn=handlers[type];
  if(!fn)return toast('Unknown type','err');
  modal('🗑️ Delete Entry','<div class="al ae">Delete <strong>'+label+'</strong>?<br><br>✅ Cash register will be fully reversed.<br>✅ Stock will be restored.<br>✅ All linked records will be undone.<br><br>This cannot be undone.</div>',fn,'Yes, Delete',true);
}
// Primary storage: IndexedDB (~500MB+). Falls back to localStorage (5MB).
const DB_NAME='TAJ_ERP_DB', DB_STORE='erp_data', DB_KEY='taj_state', DB_VER=1;
let _db=null, _dbReady=false, _saveQueue=null;

function openDB(){
  return new Promise((res,rej)=>{
    if(_db){res(_db);return;}
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE))
        db.createObjectStore(DB_STORE);
    };
    req.onsuccess=e=>{_db=e.target.result;_dbReady=true;res(_db);};
    req.onerror=()=>{_dbReady=false;rej(req.error);};
  });
}

function saveIDB(){
  return openDB().then(db=>{
    return new Promise((res,rej)=>{
      const tx=db.transaction(DB_STORE,'readwrite');
      const st=tx.objectStore(DB_STORE);
      const req=st.put(JSON.stringify(S),DB_KEY);
      req.onsuccess=()=>res();
      req.onerror=()=>rej(req.error);
    });
  });
}

function loadIDB(){
  return openDB().then(db=>{
    return new Promise((res,rej)=>{
      const tx=db.transaction(DB_STORE,'readonly');
      const st=tx.objectStore(DB_STORE);
      const req=st.get(DB_KEY);
      req.onsuccess=()=>res(req.result||null);
      req.onerror=()=>rej(req.error);
    });
  });
}

// Migrate existing localStorage data to IndexedDB (runs once)
function migrateToIDB(){
  const lsData=localStorage.getItem('taj_final');
  if(!lsData)return Promise.resolve(false);
  return saveIDB().then(()=>{
    // Keep localStorage as emergency backup but mark migrated
    localStorage.setItem('taj_idb_migrated','1');
    return true;
  }).catch(()=>false);
}

// Load from IndexedDB first, fallback to localStorage
function loadFromStorage(){
  return loadIDB().then(raw=>{
    if(!raw)return false;
    const p=JSON.parse(raw);
    Object.keys(p).forEach(k=>{
      if(k==='settings'&&typeof p[k]==='object'&&typeof S[k]==='object'){
        Object.keys(p[k]).forEach(sk=>{S[k][sk]=p[k][sk];});
        Object.keys(DEF[k]).forEach(sk=>{if(S[k][sk]===undefined)S[k][sk]=DEF[k][sk];});
      }else{S[k]=p[k];}
    });
    ['customerCredits','expenses','oldGold','oldSilverPool','salesReturns','purchaseReturns','allFlowsIn','allFlowsOut','salesReturnRefunds','oldGoldCashOuts','oldGoldCashIns','exchangeCashFlows'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});
    if(typeof S.vendorLedgers!=='object'||Array.isArray(S.vendorLedgers))S.vendorLedgers={};
    if(typeof S.weightThresholds!=='object'||Array.isArray(S.weightThresholds))S.weightThresholds={};
    if(!S.settings.logoUrl)S.settings.logoUrl='';
    return true;
  }).catch(()=>false);
}

function save(){
  // Save to IndexedDB (primary) + localStorage (backup)
  const json=JSON.stringify(S);
  // localStorage backup (best effort)
  try{localStorage.setItem('taj_final',json);}catch(e){}
  // IndexedDB primary (async, non-blocking)
  if(_saveQueue)clearTimeout(_saveQueue);
  _saveQueue=setTimeout(()=>{
    saveIDB().catch(()=>{});
  },300); // debounce 300ms — batch rapid saves
  // Storage size check
  const usedPct=json.length/(500*1024*1024)*100; // vs 500MB for IDB
  const lsPct=json.length/(5*1024*1024)*100; // vs 5MB for localStorage
  if(lsPct>85&&!window._storWarnShown){
    window._storWarnShown=true;
    toast('⚠️ localStorage backup full. Data safe in IndexedDB (500MB). But download backup now!','warn');
  }
  if(usedPct>70&&!window._storWarn70){
    window._storWarn70=true;
    toast('⚠️ Storage '+usedPct.toFixed(1)+'% of 500MB used. Keep taking daily backups.','warn');
  }
}

const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function td(){const n=new Date();return`${n.getFullYear()}-${p2(n.getMonth()+1)}-${p2(n.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
function fmt(d){if(!d)return'';try{const x=new Date(d+'T00:00:00');return`${p2(x.getDate())}-${MO[x.getMonth()]}-${x.getFullYear()}`;}catch(e){return d;}}
function fr(n){n=parseFloat(n)||0;return'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function frs(n){n=parseFloat(n)||0;const a=Math.abs(n),sg=n<0?'-':'';if(a>=1e7)return sg+'₹'+(a/1e7).toFixed(2)+'Cr';if(a>=1e5)return sg+'₹'+(a/1e5).toFixed(2)+'L';if(a>=1000)return sg+'₹'+(a/1000).toFixed(1)+'K';return sg+'₹'+a.toFixed(0);}
function fg(g){return(parseFloat(g)||0).toFixed(3)+'g';}
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+parseInt(n));return`${x.getFullYear()}-${p2(x.getMonth()+1)}-${p2(x.getDate())}`;}
function ddiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/(864e5));}
function cst(due){if(!due)return{t:'UNKNOWN',c:'bmu',a:''};const d=ddiff(td(),due);if(d<0)return{t:'OVERDUE',c:'ber',a:'ov'};if(d===0)return{t:'DUE TODAY',c:'bwr',a:'dt2'};if(d<=3)return{t:'DUE SOON',c:'bin',a:'ds'};return{t:'ON TRACK',c:'bsc',a:''};}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(m,t='ok'){const el=document.getElementById('toast');el.textContent=m;const cols={ok:['#0D2E1E','var(--ok)'],err:['#2D1515','var(--er)'],warn:['#2D1F08','var(--wa)'],info:['#0F1F3D','var(--in)']};const[bg,br]=cols[t]||cols.ok;el.style.background=bg;el.style.borderColor=br;el.style.color='#fff';el.style.opacity=1;clearTimeout(window._tt);window._tt=setTimeout(()=>el.style.opacity=0,3500);}

// ═══ CALCULATIONS ════════════════════════════════════════════
const PMAP={'22K':.92,'18K':.76,'92.5%':.925,'62%':.62};
function pct(p){
  if(PMAP[p]!==undefined)return PMAP[p];
  // Variable purity: stored as "67%" or numeric string
  if(typeof p==='string'&&p.endsWith('%')){const n=parseFloat(p);if(!isNaN(n))return n/100;}
  if(!isNaN(parseFloat(p)))return parseFloat(p)/100;
  return null;
}
function pOpts(m){return m==='Gold'?['22K','18K']:['92.5%','62%','Variable'];}
function pRate(metal,rate){return rate?(metal==='Gold'?rate.pureGold:rate.pureSilver):0;}
function genCC(metal,name){return(metal==='Gold'?'G':'S')+name.trim().split(/\s+/).map(x=>x[0].toUpperCase()).join('');}
function calcCost(pu,wt,mk,mt,pr){
  wt=parseFloat(wt)||0;mk=parseFloat(mk)||0;pr=parseFloat(pr)||0;
  if(!wt||!pr)return 0;
  if(pu==='92.5%'&&mt==='fixed_gram')return(wt*pr*0.925)+(wt*mk);
  const p=pct(pu)||0;
  return mt==='percent'?wt*(p+mk/100)*pr:wt*p*pr+wt*mk;
}
function calcGrams(pu,wt,mk,mt){wt=parseFloat(wt)||0;mk=parseFloat(mk)||0;const p=pct(pu)||0;return mt==='percent'?wt*(p+mk/100):wt*p;}

// ★ AUTO MAKING: weight × (makingPct/100 + purity%) × pureRate OR weight × fixedRate
// purityRate for making formula: 22K→gold22k, 18K→gold18k, 92.5%→pureSilver, 62%→silver62
function purityRateVal(metal,purity,rate){
  if(!rate)return 0;
  if(metal==='Gold'){
    if(purity==='22K')return rate.pureGold*0.92;
    if(purity==='18K')return rate.pureGold*0.76;
    // Variable or numeric: use pct()
    const p=pct(purity);return p?rate.pureGold*p:rate.pureGold;
  }else{
    if(purity==='92.5%')return rate.pureSilver*0.925;
    if(purity==='62%')return rate.pureSilver*0.62;
    // Variable or numeric: use pct()
    const p=pct(purity);return p?rate.pureSilver*p:rate.pureSilver;
  }
}
function calcMakingAmount(weight,makingValue,makingType,prVal){
  weight=parseFloat(weight)||0;makingValue=parseFloat(makingValue)||0;prVal=parseFloat(prVal)||0;
  if(makingType==='percent')return weight*prVal*(makingValue/100);
  if(makingType==='fixed_gram')return weight*makingValue;
  return makingValue; // 'normal'=manual ₹ amount stored as-is
}
function makingDisplay(makingValue,makingType,makingAmt){
  if(makingType==='percent')return makingValue+'% = '+fr(makingAmt);
  return '₹'+makingValue+'/g = '+fr(makingAmt);
}

// ★ DYNAMIC INVOICE PROFIT — called after credit payment or return
function recalcInvoiceProfit(invoiceId){
  const inv=S.invoices[invoiceId];if(!inv)return;
  const rate=S.rates[inv.date]||S.rates[td()];
  let acP=0,rP=0;
  (inv.items||[]).forEach(it=>{
    if(it.returned)return;
    const sp=parseFloat(it.sellingPrice);
    if(sp===undefined||sp===null||isNaN(sp))return;
    const pr=rate?pRate(it.metal,rate):(parseFloat(it.pureRate)||0);
    const wt=parseFloat(it.weight)||0;
    const rc=calcCost(it.purity,wt,it.makingValue,it.makingType,pr);
    it.itemProfit=sp-(parseFloat(it.costPrice)||0);
    it.itemReplProfit=sp-rc;
    acP+=it.itemProfit;rP+=it.itemReplProfit;
  });
  inv.acctgProfit=acP;inv.replProfit=rP;
  // recalc received = upfront + credit collected
  const upfront=Object.values(inv.paymentBreakdown||{}).reduce((s,v)=>s+(parseFloat(v)||0),0);
  const creditCollected=(S.customerCredits||[]).filter(c=>c.invoiceId===invoiceId).reduce((s,c)=>s+(parseFloat(c.paid)||0),0);
  inv.received=upfront+creditCollected;
}

// Week bounds Mon–Sun
function getWeekBounds(){const now=new Date();const day=now.getDay();const diff=day===0?6:day-1;const mon=new Date(now);mon.setDate(now.getDate()-diff);const sun=new Date(mon);sun.setDate(mon.getDate()+6);const f=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;return{start:f(mon),end:f(sun)};}

function genItemId(cc){if(!S.counters[cc])S.counters[cc]=0;S.counters[cc]++;return cc+String(S.counters[cc]).padStart(4,'0');}
function genVId(){
  // Use timestamp+random to prevent collision when records are deleted
  const ts=Date.now().toString(36).toUpperCase();
  const rd=Math.random().toString(36).slice(2,5).toUpperCase();
  return'VND-'+ts.slice(-4)+rd;
}
function genCId(){
  const ts=Date.now().toString(36).toUpperCase();
  const rd=Math.random().toString(36).slice(2,5).toUpperCase();
  return'CUST-'+ts.slice(-4)+rd;

function genIId(){
  // FIX BUG-16: Use global atomic counter — never repeats even on backdated invoices
  // Format: TAJ-YY-NNNN (financial year resets every April 1)
  const now=new Date();
  const month=now.getMonth()+1; // 1-12
  const year=now.getFullYear();
  // Financial year: Apr–Mar. If month >= 4, FY = year, else FY = year-1
  const fyYear=(month>=4?year:year-1);
  const fyShort=String(fyYear).slice(2); // e.g. "25" for 2025-26
  // Global counter key per financial year
  const cKey='inv_fy_'+fyYear;
  if(!S.counters[cKey])S.counters[cKey]=0;
  S.counters[cKey]++;
  return'TAJ-'+fyShort+'-'+String(S.counters[cKey]).padStart(4,'0');
}
function genOGId(){
  const ts=Date.now().toString(36).toUpperCase();
  return'OG-'+ts.slice(-6);
}

// ═══ STOCK VALUE ════════════════════════════════════════════
function stockVals(){
  const rate=S.rates[td()];let gv=0,sv=0,gw=0,sw=0;const cv={};
  Object.values(S.products).forEach(cat=>{
    const av=Object.values(S.items).filter(i=>i.catCode===cat.catCode&&i.status==='Available');
    const wt=av.reduce((s,i)=>s+(i.isBulk?(i.remainingWeight||0):i.weight),0);
    const pr=rate?(cat.metal==='Gold'?rate.pureGold:rate.pureSilver):0;
    // FIX AE-06: Use per-item purity for accurate stock valuation (not category default)
    let totalItemVal=0;
    av.forEach(function(i){
      const iPurity=pct(i.purity)||pct(cat.purity)||.92;
      const iWt=i.isBulk?(i.remainingWeight||0):i.weight;
      totalItemVal+=iWt*iPurity*pr;
    });
    const p=pct(cat.purity)||.92;const val=totalItemVal; // now item-level, not category-level
    cv[cat.catCode]={wt,val,metal:cat.metal};
    if(cat.metal==='Gold'){gv+=val;gw+=wt;}else{sv+=val;sw+=wt;}
  });
  return{gv,sv,gw,sw,cv};
}

function getVL(vid){if(!S.vendorLedgers[vid])S.vendorLedgers[vid]={cashEntries:[],cashPayments:[],goldEntries:[],goldPayments:[],silverEntries:[],silverPayments:[],openingCash:0,openingGoldG:0,openingSilverG:0};return S.vendorLedgers[vid];}
function vlCashDue(vid){const vl=getVL(vid);const tot=(vl.openingCash||0)+vl.cashEntries.reduce((s,e)=>s+e.amount,0);const paid=vl.cashPayments.reduce((s,p)=>s+p.amount,0);return tot-paid;}
function vlGoldDue(vid){const vl=getVL(vid);const tot=(vl.openingGoldG||0)+vl.goldEntries.reduce((s,e)=>s+e.grams,0);const paid=vl.goldPayments.reduce((s,p)=>s+p.grams,0);return tot-paid;}
function vlSilverDue(vid){const vl=getVL(vid);const tot=(vl.openingSilverG||0)+vl.silverEntries.reduce((s,e)=>s+e.grams,0);const paid=vl.silverPayments.reduce((s,p)=>s+p.grams,0);return tot-paid;}

function flowIn(date,amount,mode,type,desc,metal='General'){if(!(amount>0))return;S.allFlowsIn.push({id:uid(),date,amount,mode:mode||'cash',type,desc,metal:metal||'General'});}
function flowOut(date,amount,mode,type,desc,metal='General'){if(!(amount>0))return;S.allFlowsOut.push({id:uid(),date,amount,mode:mode||'cash',type,desc,metal:metal||'General'});}

// ═══ METAL-AWARE CASH REGISTER ENGINE ════════════════════════
// metal = 'Gold' | 'Silver' | null (combined)
function calcCashMetal(date,metal){
  const reg=S.cashReg[date]||{};
  const MODES=['cash','upi','card','cheque'];
  // Opening balances — separate per metal
  let opening;
  if(!metal){
    opening={cash:reg.openingCash||0,upi:reg.openingUpi||0,card:reg.openingCard||0,cheque:reg.openingCheque||0};
  }else{
    const pre=metal.toLowerCase();
    // Try new format first (goldOpeningCash), then goldOpening object
    const ob=reg[pre+'Opening']||{};
    opening={
      cash:reg[pre+'OpeningCash']||ob.cash||0,
      upi:reg[pre+'OpeningUpi']||ob.upi||0,
      card:reg[pre+'OpeningCard']||ob.card||0,
      cheque:reg[pre+'OpeningCheque']||ob.cheque||0
    };
  }
  const modes_in={cash:0,upi:0,card:0,cheque:0};
  const modes_out={cash:0,upi:0,card:0,cheque:0};

  // IN from invoices — proportional split by metal selling price
  Object.values(S.invoices).filter(i=>i.date===date&&i.status!=='returned').forEach(inv=>{
    if(!metal){
      MODES.forEach(m=>{modes_in[m]+=(inv.paymentBreakdown?.[m]||0);});
    }else{
      const items=inv.items||[];
      const totalSP=items.reduce((s,it)=>s+(parseFloat(it.sellingPrice)||0),0);
      const metalSP=items.filter(it=>it.metal===metal).reduce((s,it)=>s+(parseFloat(it.sellingPrice)||0),0);
      const ratio=totalSP>0?metalSP/totalSP:0;
      MODES.forEach(m=>{modes_in[m]+=(inv.paymentBreakdown?.[m]||0)*ratio;});
    }
  });

  // IN from allFlowsIn — filter by metal if specified
  (S.allFlowsIn||[]).filter(f=>f.date===date&&f.type!=='sale'&&(!metal||(f.metal||'General')===metal)).forEach(f=>{
    modes_in[f.mode||'cash']+=f.amount;
  });

  // OUT from allFlowsOut — filter by metal if specified
  (S.allFlowsOut||[]).filter(f=>f.date===date&&f.type!=='sales_return_refund'&&(!metal||(f.metal||'General')===metal)).forEach(f=>{
    modes_out[f.mode||'cash']+=f.amount;
  });

  // OUT from expenses — filter by metal if specified (expense.metal field)
  (S.expenses||[]).filter(e=>e.date===date&&(!metal||(e.metal||'General')===metal)).forEach(e=>{
    modes_out[e.paymentMode||'cash']+=(e.amount||0);
  });

  // OUT from sales return refunds — proportional if metal filter
  (S.salesReturnRefunds||[]).filter(r=>r.date===date).forEach(r=>{
    if(!metal){
      modes_out[r.mode||'cash']+=(r.amount||0);
    }else{
      const inv=r.invoiceId?S.invoices[r.invoiceId]:null;
      if(inv){
        const items=inv.items||[];
        const totalSP=items.reduce((s,it)=>s+(parseFloat(it.sellingPrice)||0),0);
        const metalSP=items.filter(it=>it.metal===metal).reduce((s,it)=>s+(parseFloat(it.sellingPrice)||0),0);
        const ratio=totalSP>0?metalSP/totalSP:0;
        modes_out[r.mode||'cash']+=(r.amount||0)*ratio;
      }
    }
  });

  // Legacy arrays — assume Gold for backward compat
  const legacyMetal=metal||null;
  if(!legacyMetal||legacyMetal==='Gold'){
    (S.oldGoldCashIns||[]).filter(o=>o.date===date).forEach(o=>{modes_in[o.mode||'cash']+=(o.amount||0);});
    (S.oldGoldCashOuts||[]).filter(o=>o.date===date).forEach(o=>{modes_out[o.mode||'cash']+=(o.amount||0);});
    (S.exchangeCashFlows||[]).filter(e=>e.date===date).forEach(e=>{if(e.direction==='in')modes_in[e.mode||'cash']+=(e.amount||0);else modes_out[e.mode||'cash']+=(e.amount||0);});
  }

  const net={};let totalNet=0;
  MODES.forEach(m=>{net[m]=opening[m]+modes_in[m]-modes_out[m];totalNet+=net[m];});
  return{opening,modes_in,modes_out,net,totalNet,calc:totalNet,
    salesCash:modes_in.cash,expCash:modes_out.cash};
}

// Backward-compatible calcCash — combined all metals
function calcCash(date){return calcCashMetal(date,null);}

// Helper: get today's gold + silver register totals for topbar
function getMetalCash(){
  const d=td();
  const g=calcCashMetal(d,'Gold');
  const s=calcCashMetal(d,'Silver');
  return{gold:g.totalNet,silver:s.totalNet,combined:g.totalNet+s.totalNet};
}

// FIX S-01: Simple password comparison with hash awareness
// New passwords are stored as SHA-256 hash prefixed with "sha256:"
async function hashPw(pw){
  const enc=new TextEncoder().encode(pw+':TAJ_SALT_2025');
  const buf=await crypto.subtle.digest('SHA-256',enc);
  return'sha256:'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function pwMatch(input,stored){
  // Support both plain (legacy) and hashed passwords
  if(stored.startsWith('sha256:'))return hashPw(input).then(h=>h===stored);
  return Promise.resolve(input===stored);
}
function doLogin(){
  const p=document.getElementById('lp').value;
  const role=document.getElementById('lRole')?.value||'owner';
  // Pick the right password based on selected role
  const stored=role==='staff'?(S.settings.staffPassword||''):(S.settings.password||'');
  if(!stored){
    document.getElementById('le').style.display='block';
    document.getElementById('le').textContent='❌ Password not set for this role. Contact Owner.';
    return;
  }
  // Support both plain (legacy) passwords and SHA-256 hashed passwords
  function tryLogin(ok){
    if(ok){
      document.getElementById('ls').style.display='none';
      document.getElementById('shell').style.display='flex';
      init();
    }else{
      document.getElementById('le').style.display='block';
      document.getElementById('le').textContent='❌ Wrong '+role+' password. Try again.';
      document.getElementById('lp').value='';
      document.getElementById('lp').focus();
    }
  }
  if(stored.startsWith('sha256:')){
    hashPw(p).then(h=>tryLogin(h===stored));
  }else{
    tryLogin(p===stored);
  }
}
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ═══ MOBILE GRID FIXER — overrides inline grid styles ════════
function fixMobileGrids(){
  if(window.innerWidth>768)return;
  // Override all inline grid-template-columns inside #pg
  document.querySelectorAll('#pg [style]').forEach(el=>{
    const s=el.style;
    if(s.gridTemplateColumns&&s.gridTemplateColumns!=='1fr'){
      el.setAttribute('data-orig-grid',s.gridTemplateColumns);
      s.gridTemplateColumns='1fr';
    }
    // Convert side-by-side flex rows → column
    if(s.display==='flex'&&(s.flexDirection===''||!s.flexDirection)){
      const kids=el.children;
      // Only wrap if children look like a form+table pair (first child is a card/form)
      if(kids.length===2&&kids[0].classList.contains('card')){
        el.style.flexDirection='column';
      }
    }
  });
}

// ═══ SWIPE TO OPEN SIDEBAR (mobile) ══════════════════════════
(function(){
  let tx0=0,ty0=0;
  document.addEventListener('touchstart',function(e){
    tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(window.innerWidth>768)return;
    const dx=e.changedTouches[0].clientX-tx0;
    const dy=Math.abs(e.changedTouches[0].clientY-ty0);
    // Swipe right from left edge → open sidebar
    if(dx>50&&dy<60&&tx0<30){toggleMobSB();}
    // Swipe left → close sidebar
    if(dx<-50&&dy<60&&document.getElementById('sb').classList.contains('mob-open')){closeMobSB();}
  },{passive:true});
  // On resize: if desktop, restore sidebar visibility
  window.addEventListener('resize',function(){
    if(window.innerWidth>768){
      document.getElementById('sb').classList.remove('mob-open');
      document.getElementById('sbOv').classList.remove('open');
      document.body.style.overflow='';
    }else{
      setTimeout(fixMobileGrids,80);
    }
  });
})();

function osEdit(id){
  const item=S.items[id];
  if(!item)return toast('Item not found','err');
  if(item.status!=='Available')return toast('Cannot edit — item already sold','err');
  // Fill form with existing values
  document.getElementById('osFormTitle').textContent='✏️ Edit Opening Stock — '+id;
  document.getElementById('osEditId').value=id;
  document.getElementById('od').value=item.entryDate;
  // Set category
  const catSel=document.getElementById('oc');
  catSel.value=item.catCode;
  osCh(); // trigger meta display
  document.getElementById('ow').value=item.weight;
  document.getElementById('omk').value=item.makingValue;
  document.getElementById('ib').checked=item.isBulk||false;
  osC(); // recalculate preview
  // Switch button to Update
  document.getElementById('osSvBtn').textContent='💾 Update Stock';
  document.getElementById('osSvBtn').onclick=osUpd;
  document.getElementById('osCnBtn').style.display='inline-flex';
  // Scroll to form
  document.getElementById('pg').scrollIntoView({behavior:'smooth'});
  toast('Editing '+id+' — make changes and tap Update');
}

function osUpd(){
  const id=document.getElementById('osEditId').value;
  if(!id)return osSv();
  const item=S.items[id];
  if(!item)return toast('Item not found','err');
  const d=document.getElementById('od').value;
  const cc=document.getElementById('oc').value;
  const w=parseFloat(document.getElementById('ow').value);
  const m=parseFloat(document.getElementById('omk').value)||0;
  const bulk=document.getElementById('ib').checked;
  if(!cc||!w)return toast('Fill all required fields','err');
  const r=S.rates[d];
  if(!r)return toast('No rate for this date. Enter in Rate Master first.','err');
  const p=S.products[cc];
  const pr=pRate(p.metal,r);
  const cost=calcCost(p.purity,w,m,p.makingType,pr);
  // Update item — preserve status, invoiceId, soldDate
  S.items[id]={...item,catCode:cc,metal:p.metal,purity:p.purity,roundedPct:pct(p.purity)||.92,weight:w,remainingWeight:bulk?(item.remainingWeight+(w-item.weight)):w,makingValue:m,makingType:p.makingType,costPrice:cost,pureRate:pr,entryDate:d,isBulk:bulk};
  aLog('EDIT','OpeningStock',id,`Updated: wt=${w}g mk=${m} cost=${fr(cost)}`);
  save();
  toast('✅ '+id+' updated successfully!');
  osCancel();
  PAGES['opening-stock']();
}

  document.getElementById('ocb').style.display='none';
}

function osC(){const d=document.getElementById('od')?.value,cc=document.getElementById('oc')?.value,w=document.getElementById('ow')?.value,m=document.getElementById('omk')?.value;if(!d||!cc||!w)return;const r=S.rates[d];document.getElementById('orw').style.display=r?'none':'flex';if(!r){document.getElementById('ocb').style.display='none';return;}const p=S.products[cc],pr=pRate(p.metal,r),cost=calcCost(p.purity,w,m||0,p.makingType,pr);document.getElementById('ocb').style.display='block';document.getElementById('ocd').textContent=fr(cost);document.getElementById('orh').textContent=`Rate on ${fmt(d)}: ${fr(pr)}/g (Pure ${p.metal})`;}
function osSv(){
  const d=document.getElementById('od').value,cc=document.getElementById('oc').value;
  const w=parseFloat(document.getElementById('ow').value),m=parseFloat(document.getElementById('omk').value)||0;
  const bulk=document.getElementById('ib').checked;
  if(!cc||!w)return toast('Fill all required fields','err');
  const r=S.rates[d];if(!r)return toast('No rate for this date. Enter in Rate Master first.','err');

  const entryTs=new Date().toISOString(); // for 24hr delete
  if(bulk){
    // SINGLE BULK ID PER CATEGORY — find existing bulk item for this category
    const existing=Object.values(S.items).find(it=>it.isBulk&&it.catCode===cc&&it.source==='opening_stock'&&it.status==='Available');
    if(existing){
      // Add weight to existing bulk — blend cost average
      const prevWt=existing.weight||0;
      const prevCost=existing.costPrice||0;
      existing.weight=prevWt+w;
      existing.remainingWeight=(existing.remainingWeight||prevWt)+w;
      existing.costPrice=prevCost+cost;
      existing.blendedCostPerGram=existing.costPrice/existing.weight;
      existing.pureRate=((existing.pureRate||0)*prevWt+pr*w)/existing.weight;
      existing.entryTs=entryTs; // reset 24hr timer on top-up
      save();toast(`✅ Added ${fg(w)} to existing bulk ${existing.itemId}. Total: ${fg(existing.remainingWeight)}`);
      PAGES['opening-stock']();return;
    }
  }
  const id=bulk?cc+'-BULK':genItemId(cc);
  S.items[id]={itemId:id,catCode:cc,metal:p.metal,purity:p.purity,roundedPct:pct(p.purity)||.92,weight:w,remainingWeight:w,makingValue:m,makingType:p.makingType,costPrice:cost,pureRate:pr,vendorId:null,entryDate:d,source:'opening_stock',payType:'spot',status:'Available',invoiceId:null,isBulk:bulk,entryTs};
  save();toast(`✅ ${id} added to stock!`);PAGES['opening-stock']();
}

function pPC(){

function pC(){
  const d=document.getElementById('pd').value,cc=document.getElementById('pc').value,w=document.getElementById('pw').value,m=document.getElementById('pm').value,pt=document.querySelector('input[name="ppt"]:checked')?.value;
  if(!cc||!w||!d)return;
  const r=S.rates[d];document.getElementById('prw').style.display=r?'none':'flex';
  if(!r){document.getElementById('pprev').style.display='none';return;}
  const p=S.products[cc];
  // Show/hide variable purity input
  const varEl=document.getElementById('pVarPurityRow');
  if(varEl)varEl.style.display=p.purity==='Variable'?'block':'none';
  let usePurity=p.purity;
  if(p.purity==='Variable'){
    const vp=document.getElementById('pVarPurity')?.value?.trim();
    if(vp&&!isNaN(parseFloat(vp)))usePurity=parseFloat(vp)+'%';
    else{document.getElementById('pprev').style.display='none';return;}
  }
  const pr=pRate(p.metal,r),cost=calcCost(usePurity,w,m||0,p.makingType,pr),grams=calcGrams(usePurity,w,m||0,p.makingType);
  const nextN=(S.counters[cc]||0)+1,preId=cc+String(nextN).padStart(4,'0');

  document.getElementById('ppgr').style.display=pt==='pure_credit'?'flex':'none';
  if(pt==='pure_credit')document.getElementById('ppg').textContent=fg(grams);
  document.getElementById('ppreghint').style.display=(pt==='spot'||pt==='gst_purchase')?'flex':'none';
  if(pt==='spot')document.getElementById('ppch').textContent='−'+fr(cost)+' from Cash Register today';

  const d=document.getElementById('pd').value,vi=document.getElementById('pv').value,cc=document.getElementById('pc').value;
  const w=parseFloat(document.getElementById('pw').value),m=parseFloat(document.getElementById('pm').value)||0;
  const pt=document.querySelector('input[name="ppt"]:checked').value,cd=parseInt(document.getElementById('pcdv').value)||30,bulk=document.getElementById('pBk').checked;
  if(!cc||!vi||!w)return toast('Fill all required fields','err');
  const r=S.rates[d];if(!r)return toast('No rate for this date','err');
  const p=S.products[cc];
  // VARIABLE PURITY: read from user input
  let usePurity=p.purity;
  if(p.purity==='Variable'){
    const vp=document.getElementById('pVarPurity')?.value?.trim();
    if(!vp)return toast('Enter purity % for this Variable Purity item','err');
    const vpNum=parseFloat(vp);
    if(isNaN(vpNum)||vpNum<=0||vpNum>100)return toast('Enter a valid purity % (1–100)','err');
    usePurity=vpNum+'%'; // store as e.g. "67%"
  }
  const pr=pRate(p.metal,r),baseCost=calcCost(usePurity,w,m,p.makingType,pr);
  // ★ BULK FIX: reuse single bulk ID per category — format: catCode-BULK
  let id;
  if(bulk){
    const existing=Object.values(S.items).find(it=>it.isBulk&&it.catCode===cc&&it.status==='Available');
    if(existing){
      // Add weight to existing — blended average cost
      const prevWt=parseFloat(existing.weight)||0;
      const prevCost=parseFloat(existing.costPrice)||0;
      existing.remainingWeight=(parseFloat(existing.remainingWeight)||0)+w;
      existing.weight=prevWt+w;
      existing.costPrice=prevCost+baseCost;
      existing.blendedCostPerGram=existing.costPrice/existing.weight;
      existing.pureRate=((existing.pureRate||0)*prevWt+pr*w)/existing.weight;
      existing.entryTs=new Date().toISOString();
      id=existing.itemId;
    }else{
      id=cc+'-BULK'; // single permanent ID for this category
    }
  }else{
    id=genItemId(cc);
  }
  let finalCost=baseCost,inputGST=null;
  const hasGst=document.getElementById('pgstChk')?.checked||false;
  if(hasGst){
    const gp=parseFloat(document.getElementById('pgstPct')?.value)||0;
    const ga=baseCost*(gp/100);
    finalCost=baseCost+ga;
    inputGST={gstPct:gp,gstAmt:ga,basePrice:baseCost,totalWithGST:finalCost};
  }
  // Only create new item record if it doesn't already exist (new or non-bulk)
  if(!S.items[id]){
    S.items[id]={itemId:id,catCode:cc,metal:p.metal,purity:usePurity,roundedPct:pct(usePurity)||.92,weight:w,remainingWeight:w,makingValue:m,makingType:p.makingType,costPrice:finalCost,baseCost,pureRate:pr,vendorId:vi,entryDate:d,source:'purchase',payType:pt,status:'Available',invoiceId:null,isBulk:bulk,inputGST,entryTs:new Date().toISOString()};
  }else if(bulk){
    // Already updated weight above; update GST and pay type fields too
    if(inputGST)S.items[id].inputGST=inputGST;
  }
  const vl=getVL(vi);
  const gstSuffix=inputGST?` [GST ${inputGST.gstPct}% = ₹${inputGST.gstAmt.toFixed(2)}]`:'';
  if(pt==='spot'){
    const mode=document.getElementById('pspotmode')?.value||'cash';
    flowOut(d,finalCost,mode,inputGST?'gst_purchase':'spot_purchase','Spot purchase'+gstSuffix+': '+id+' from '+(S.vendors[vi]?.name||vi),p.metal);
    toast(`✅ ${id} added! ${mode.toUpperCase()} deducted from register.${gstSuffix}`);
  }else if(pt==='cash_credit'){
    const due=addDays(d,cd);
    vl.cashEntries.push({id:uid(),date:d,catCode:cc,amount:finalCost,due,note:'Purchase: '+id+gstSuffix,inputGST});
    toast(`✅ ${id} added! Cash credit to vendor ledger.${gstSuffix}`);
  }else if(pt==='pure_credit'){
    const g=calcGrams(usePurity,w,m,p.makingType); // FIX B-05: use actual purity, not category default
    if(p.metal==='Gold')vl.goldEntries.push({id:uid(),date:d,catCode:cc,grams:g,note:'Purchase: '+id+gstSuffix,inputGST});
    else vl.silverEntries.push({id:uid(),date:d,catCode:cc,grams:g,note:'Purchase: '+id+gstSuffix,inputGST});
    toast(`✅ ${id} added! Pure credit to vendor ledger.${gstSuffix}`);
  }
  save();updateTopbar();PAGES['purchase']();
  aLog('CREATE','Item',id,`Category: ${cc} | Weight: ${w}g | Purity: ${usePurity} | Cost: ${fr(finalCost)} | Vendor: ${S.vendors[vi]?.name}`);
}

function exchToggle(){

    ['exWt','exPurity','exVal'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    const pmx=document.getElementById('pmX');if(pmx)pmx.value='0';
    const info=document.getElementById('exInfo');if(info)info.style.display='none';
    const refundRow=document.getElementById('exRefundRow');if(refundRow)refundRow.style.display='none';
    const refundAmt=document.getElementById('exRefundAmt');if(refundAmt)refundAmt.value='';
    pmV();
  }
}
function exchCalc(){
  const w=parseFloat(document.getElementById('exWt')?.value)||0;
  const p=parseFloat(document.getElementById('exPurity')?.value)||0;
  const v=parseFloat(document.getElementById('exVal')?.value)||0;
  const info=document.getElementById('exInfo');
  if(w&&p&&info){
    const pureWt=w*(p/100);
    info.style.display='block';
    const rate=S.rates[td()];
    const mktMetal=document.getElementById('exMetal')?.value||'Gold';
    const mktVal=pureWt*(mktMetal==='Gold'?rate?.pureGold||0:rate?.pureSilver||0);
    info.textContent='Pure weight: '+(pureWt.toFixed(3))+'g'+(mktVal?' | Market value ≈ ₹'+fr(mktVal):'')+(v?' | You pay: ₹'+fr(v):'');
  }
  // Auto-fill exchange credit field (read-only display)
  const pmx=document.getElementById('pmX');
  if(pmx)pmx.value=v>0?v.toFixed(2):'0';
  // Auto-update Amount Received = net payable - exchange (cash customer needs to pay)
  const bTotEl=document.getElementById('bNetAmt');
  const bTot=parseFloat(bTotEl?.textContent?.replace(/[^\d.]/g,''))||0;
  const refundRow=document.getElementById('exRefundRow');
  const refundAmt=document.getElementById('exRefundAmt');
  if(bTot>0){
    const cashNeeded=bTot-v;
    const brEl=document.getElementById('br');
    const pmCEl=document.getElementById('pmC');
    const pmW=document.getElementById('pmW');
    if(cashNeeded>=0){
      // Normal: customer pays the difference
      if(brEl)brEl.value=cashNeeded.toFixed(2);
      if(pmCEl)pmCEl.value=cashNeeded.toFixed(2);
      if(pmW)pmW.style.display='none';
      // Hide refund row
      if(refundRow)refundRow.style.display='none';
      if(refundAmt)refundAmt.value='';
    } else {
      // Exchange exceeds sale — refund due to customer
      if(brEl)brEl.value='0.00';
      if(pmCEl)pmCEl.value='0.00';
      if(pmW)pmW.style.display='none';
      const refAmt=Math.abs(cashNeeded);
      if(refundRow)refundRow.style.display='block';
      if(refundAmt)refundAmt.value=refAmt.toFixed(2);
    }
  } else {
    if(refundRow)refundRow.style.display='none';
  }
}

// ── BARCODE SCANNER — linked to Sales & Billing ──────────────
// Scanners send characters rapidly (< 50ms apart) ending with Enter
// Regular typing is slower — we use timing to distinguish scanner vs keyboard
(function(){
  let _buf='', _lastKey=0, _scanTimer=null;
  document.addEventListener('keydown', function(e){
    // Only active when Sales & Billing is open
    if(cur !== 'sales') return;
    // If focus is on an input, don't intercept normal typing
    const tag = document.activeElement ? document.activeElement.tagName : '';
    const isInput = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
    const now = Date.now();
    const gap = now - _lastKey;
    _lastKey = now;
    // Scanner characters come < 50ms apart
    // If gap is large and no buffer, user is typing normally — don't intercept
    if(isInput && _buf.length === 0 && gap > 100) return;
    if(e.key === 'Enter'){
      if(_buf.length >= 3){
        // Looks like a barcode scan — add item
        const scannedId = _buf.toUpperCase().trim();
        _buf = '';
        clearTimeout(_scanTimer);
        e.preventDefault();
        // Try to add the scanned item
        const item = S.items[scannedId];
        if(item && item.status === 'Available'){
          // Blur current input to avoid double-entry
          if(document.activeElement) document.activeElement.blur();
          // Set itemSearch and trigger add
          const srchEl = document.getElementById('itemSearch');
          if(srchEl){ srchEl.value = scannedId; itemAddById(); }
          toast('🏷️ Scanned: ' + scannedId + ' added to bill');
        } else if(item){
          toast('⚠️ Item ' + scannedId + ' is ' + item.status + ' — cannot add', 'err');
        } else {
          toast('⚠️ Item ' + scannedId + ' not found in stock', 'err');
        }
      }
      _buf = '';
      return;
    }
    // Accumulate scanner characters (fast input or already buffering)
    if(gap < 80 || _buf.length > 0){
      if(e.key.length === 1) _buf += e.key;
      // Auto-clear buffer if no Enter within 500ms (incomplete scan)
      clearTimeout(_scanTimer);
      _scanTimer = setTimeout(function(){ _buf = ''; }, 500);
      // Prevent scanner characters from appearing in focused input
      if(isInput && _buf.length > 0 && gap < 80) e.preventDefault();
    }
  });
})();

function itemSrch(){

    dd.classList.remove('open');

  const found=Object.values(S.items).filter(i=>i.itemId.startsWith(q)&&i.status==='Available').slice(0,10);
  if(found.length){
    dd.innerHTML=found.map(i=>'<div class="sri" onclick="pickItem(\'' + i.itemId + '\')">' + i.itemId + ' — ' + i.catCode + ' | ' + i.purity + ' | ' + fg(i.weight) + (i.isBulk?' [BULK]':'') + '</div>').join('');

function bApplyScheme(custId){
  var schemes=(S.goldSchemes||[]).filter(function(s){return s.customerId===custId&&(s.status==='matured'||s.status==='active')&&!s.redeemedInvoice;});
  if(!schemes.length)return toast('No schemes available for this customer','err');
  // Use collected amount (what customer actually paid in)
  var total=schemes.reduce(function(s,sc){return s+(sc.totalCollected||0)+(sc.status==='matured'&&!sc.totalCollected?sc.totalValue||0:0);},0);
  if(!total)return toast('No scheme amount collected yet','err');
  // Store for validation — NOT added to cash received (already in register from monthly payments)
  window._pendingSchemeIds=schemes.map(function(s){return s.id;});
  window._appliedSchemeAmt=(window._appliedSchemeAmt||0)+total;
  // Show deduction in billing UI
  bUpdateAppliedBox();
  toast('🥇 Scheme '+fr(total)+' will be applied as credit against this invoice. Monthly payments already in register.');
  var box=document.getElementById('custBalBox');if(box)box.remove();
}
function bApplyAdvance(custId){
  var advances=(S.advances||[]).filter(function(a){return a.customerId===custId&&(!a.adjustedInInvoice||a.adjustedInInvoice==='');});
  if(!advances.length)return toast('No pending advances to apply','err');
  var total=advances.reduce(function(s,a){return s+(a.amount||0);},0);
  if(!total)return toast('No advance amount found','err');
  // Store for validation — NOT added to cash received (advance already in register)
  window._pendingAdvIds=advances.map(function(a){return a.id;});
  window._appliedAdvAmt=(window._appliedAdvAmt||0)+total;
  bUpdateAppliedBox();
  toast('🎫 Advance '+fr(total)+' will be applied against this invoice. Original payment already in register.');
  var box=document.getElementById('custBalBox');if(box)box.remove();
}
function bUpdateAppliedBox(){

  var existing=document.getElementById('appliedDeductBox');
  if(!adv&&!sch){if(existing)existing.remove();return;}
  // Get net payable from bNetAmt span
  var netPayStr=(document.getElementById('bNetAmt')||{}).textContent||'0';
  var netPay=parseFloat(netPayStr.replace(/[^0-9.]/g,''))||0;
  var cashNeeded=Math.max(0,netPay-adv-sch);
  var html2='<div style="font-weight:700;color:#b07800;margin-bottom:6px;font-size:.8rem">💳 Applied Credits — Already Paid (no new cash entry)</div>'
    +(adv>0?'<div style="display:flex;justify-content:space-between;padding:3px 0"><span>🎫 Advance Paid</span><span style="color:#e07820;font-weight:700">− '+fr(adv)+'</span></div>':'')
    +(sch>0?'<div style="display:flex;justify-content:space-between;padding:3px 0"><span>🥇 Scheme Value</span><span style="color:#2e7d52;font-weight:700">− '+fr(sch)+'</span></div>':'')
    +'<div style="display:flex;justify-content:space-between;margin-top:6px;border-top:2px solid #e0a800;padding-top:6px">'
    +'<span style="font-weight:700;font-size:.85rem">Cash / New Payment to Collect</span>'
    +'<span style="font-weight:700;font-size:.95rem;color:#c0392b">'+fr(cashNeeded)+'</span></div>';
  if(!existing){
    existing=document.createElement('div');
    existing.id='appliedDeductBox';
    existing.style.cssText='background:rgba(255,200,0,.12);border:1px solid #e0a800;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:.76rem';
    // Insert inside billing card — before payment modes section
    // Use the sep div before payment modes as anchor
    var pg=document.getElementById('pg');

    var payAnchor=null;
    for(var i=0;i<allSeps.length;i++){
      var next=allSeps[i].nextElementSibling;
      if(next&&next.textContent&&next.textContent.includes('Payment Modes')){payAnchor=allSeps[i];break;}
    }
    if(payAnchor&&payAnchor.parentNode){
      payAnchor.parentNode.insertBefore(existing,payAnchor);
    } else {
      // Fallback: insert after customer info
      var custInfo=document.getElementById('bCustInfo');
      if(custInfo&&custInfo.parentNode)custInfo.parentNode.insertBefore(existing,custInfo.nextSibling);
    }
  }
  existing.innerHTML=html2;
  // Auto-set Amount Received field to cash-only if empty or zero
  var brEl=document.getElementById('br');
  if(brEl&&netPay>0&&cashNeeded>=0){
    brEl.value=cashNeeded.toFixed(2);
  }
}
function bC(){
  if(!BI.length)return;
  const sd=document.getElementById('sd')?.value||td();const rate=S.rates[sd];
  const totalQuote=BI.reduce((s,it)=>s+(parseFloat(it.quotePrice)||parseFloat(it.sellingPrice)||0),0);
  const totalFinal=BI.reduce((s,it)=>s+(parseFloat(it.sellingPrice)||0),0);
  const totalCost=BI.reduce((s,it)=>s+it.costPrice,0);
  const totalRepl=rate?BI.reduce((s,it)=>{const wt=parseFloat(it.isBulk?it.sellWt:it.weight)||0;const pr=pRate(it.metal,rate);return s+calcCost(it.purity,wt,it.makingValue,it.makingType,pr);},0):totalCost;
  const disc=Math.max(0,totalQuote-totalFinal);
  const bDiscRow=document.getElementById('bDiscRow');
  const bDiscAmt=document.getElementById('bDiscAmt');
  const bNetAmt=document.getElementById('bNetAmt');
  if(bDiscRow)bDiscRow.style.display=disc>0.01?'flex':'none';
  if(bDiscAmt)bDiscAmt.textContent='− '+fr(disc);
  if(bNetAmt)bNetAmt.textContent=fr(totalFinal);
  // Update applied credits box whenever totals recalculate
  if(window._appliedAdvAmt||window._appliedSchemeAmt)bUpdateAppliedBox();
  if(totalFinal>0&&rate){
    document.getElementById('pProf').style.display='block';
    document.getElementById('ppCost').textContent=fr(totalCost);
    document.getElementById('ppRepl').textContent=fr(totalRepl);
    document.getElementById('ppA').textContent=fr(totalFinal-totalCost);
    document.getElementById('ppR').textContent=fr(totalFinal-totalRepl);
  }
}
function pmV(){

  const cash=parseFloat(document.getElementById('pmC')?.value)||0;
  const upi=parseFloat(document.getElementById('pmU')?.value)||0;
  const card=parseFloat(document.getElementById('pmK')?.value)||0;
  const cheque=parseFloat(document.getElementById('pmH')?.value)||0;
  const cashTotal=cash+upi+card+cheque;

  const brEl=document.getElementById('br');
  if(brEl&&cashTotal>0)brEl.value=cashTotal.toFixed(2);
  const r=parseFloat(brEl?.value)||0;
  document.getElementById('pmW').style.display=Math.abs(cashTotal-r)>0.01&&r>0?'flex':'none';
}

function brV(){
  // When Amount Received is entered, auto-fill Cash with remainder after UPI/Card/Cheque
  const r=parseFloat(document.getElementById('br').value)||0;
  const upi=parseFloat(document.getElementById('pmU')?.value)||0;
  const card=parseFloat(document.getElementById('pmK')?.value)||0;
  const cheque=parseFloat(document.getElementById('pmH')?.value)||0;

  document.getElementById('pmW').style.display='none';
}
function bSave(){
  if(!selCust)return toast('Select a customer or choose Walk-in Customer','err');
  if(!BI.length)return toast('Add at least one item','err');
  const missing=BI.filter(it=>!(parseFloat(it.sellingPrice)>0));
  if(missing.length)return toast('Enter selling price for: '+missing.map(x=>x.itemId).join(', '),'err');
  const sd=document.getElementById('sd').value,rate=S.rates[sd];
  if(!rate)return toast('No rate for sale date','err');
  const ity=document.querySelector('input[name="ity"]:checked').value;
  if(ity==='gst'&&!S.settings.gstNo)return toast('❌ Cannot create GST Invoice — GSTIN not configured. Go to Settings → GST Number first.','err');
  const totalQuote=BI.reduce((s,it)=>s+(parseFloat(it.quotePrice)||parseFloat(it.sellingPrice)||0),0);
  const totalSelling=BI.reduce((s,it)=>s+(parseFloat(it.sellingPrice)||0),0);
  const disc=Math.max(0,totalQuote-totalSelling);
  const netPayable=totalSelling;
  const r=parseFloat(document.getElementById('br').value)||0;
  if(isNaN(r)||r<0)return toast('Enter received amount','err');
  const isExchangeSale=!!(document.getElementById('exchChk')?.checked);
  const exValFinal=isExchangeSale?(parseFloat(document.getElementById('exVal')?.value)||0):0;
  const exMetalFinal=document.getElementById('exMetal')?.value||'Gold';
  const exWtFinal=parseFloat(document.getElementById('exWt')?.value)||0;
  const exPurityFinal=parseFloat(document.getElementById('exPurity')?.value)||0;
  const pay={cash:parseFloat(document.getElementById('pmC').value)||0,upi:parseFloat(document.getElementById('pmU').value)||0,card:parseFloat(document.getElementById('pmK').value)||0,cheque:parseFloat(document.getElementById('pmH').value)||0,exchange:exValFinal,
    advance:window._appliedAdvAmt||0,scheme:window._appliedSchemeAmt||0};
  const crAmt=document.getElementById('addCrChk').checked?(parseFloat(document.getElementById('crAmt').value)||0):0;
  const crDue=document.getElementById('addCrChk').checked?document.getElementById('crDue').value:'';
  // Walk-in customers cannot have credit sales — checked AFTER crAmt is declared
  if(isWalkIn&&crAmt>0)return toast('Walk-in customers cannot have credit sales. Collect full payment.','err');
  // ── VALIDATE EVERYTHING FIRST — before any data is written ──
  if(crAmt>0&&!crDue)return toast('Select a due date for the credit before saving','err');
  // PHASE 4: Check credit limit
  if(crAmt>0&&selCust.customerId&&S.customers[selCust.customerId]){
    const lim=parseFloat(S.customers[selCust.customerId].creditLimit)||0;
    const existingDue=parseFloat(S.customers[selCust.customerId].creditDue)||0;
    if(lim>0&&(existingDue+crAmt)>lim){
      return toast(`❌ Credit limit exceeded! Limit: ${fr(lim)} | Existing: ${fr(existingDue)} | New: ${fr(crAmt)} | Total would be: ${fr(existingDue+crAmt)}`,'err');
    }
  }
  // HUID check — optional warning only, does not block billing
  // (HUID is noted in invoice if available, skipped if not — BIS enforcement is shop's discretion)
  const unhallmarkedWarn=BI.filter(it=>{
    if(it.metal!=='Gold')return false;
    const wt=parseFloat(it.isBulk?it.sellWt:it.weight)||0;
    if(wt<2)return false;
    return!(S.hallmarking||[]).find(r=>r.itemId===it.itemId);
  });
  if(unhallmarkedWarn.length>0){
    // Just show a gentle reminder — user can still save
    console.warn('Items without HUID (advisory only):', unhallmarkedWarn.map(x=>x.itemId).join(', '));
  }
  // VALIDATION: All payment sources must cover Net Payable exactly
  // Net Payable = cash(r) + exchange + advance + scheme + credit
  // r = actual cash/upi/card/cheque received from customer
  // exchange = old metal value given by customer (reduces what they owe)
  // If exchange > netPayable: refund scenario — customer gets money back
  const appliedAdv=window._appliedAdvAmt||0;
  const appliedScheme=window._appliedSchemeAmt||0;
  const isRefundScenario=isExchangeSale&&(exValFinal>netPayable+appliedAdv+appliedScheme);
  const exRefundFinal=isRefundScenario?Math.round((exValFinal-netPayable-appliedAdv-appliedScheme)*100)/100:0;
  const exRefundModeFinal=document.getElementById('exRefundMode')?.value||'cash';
  // In refund scenario: netPayable is fully covered by exchange, r must be 0
  const totalAccountedFor=isRefundScenario?(exValFinal-exRefundFinal):(r+crAmt+exValFinal+appliedAdv+appliedScheme);
  if(!isRefundScenario&&Math.abs(totalAccountedFor-netPayable)>1)return toast(
    'Mismatch: Cash Received ('+fr(r)+') + Exchange ('+fr(exValFinal)+') + Advance ('+fr(appliedAdv)+') + Scheme ('+fr(appliedScheme)+') + Credit ('+fr(crAmt)+') = '+fr(totalAccountedFor)+' but Net Payable = '+fr(netPayable)+'. Please fix.',
    'err');
  // Payment modes check: cash+upi+card+cheque must equal r (Amount Received)
  const payTotal=pay.cash+pay.upi+pay.card+pay.cheque;
  if(!isRefundScenario&&r>0.01&&Math.abs(payTotal-r)>1)return toast('Payment modes ('+fr(payTotal)+') must equal Amount Received ('+fr(r)+'). Fix breakdown.','err');
  // ── ALL VALIDATIONS PASSED — now commit data ──
  let acP=0,rP=0;
  const iDets=BI.map(it=>{
    const wt=parseFloat(it.isBulk?it.sellWt:it.weight)||0;
    const pr=pRate(it.metal,rate);
    const rc=calcCost(it.purity,wt,it.makingValue,it.makingType,pr);
    const sp=parseFloat(it.sellingPrice)||0;
    const iProfit=sp-it.costPrice,iReplProfit=sp-rc;
    // Use live makingCharged (set by biMkCalc via user interaction) not re-calc from master
    const makingAmt=it.makingCharged!=null?parseFloat(it.makingCharged)||0:calcMakingAmount(wt,it.makingValue,it.makingType,pr);
    acP+=iProfit;rP+=iReplProfit;
    const mkMode=it.makingMode||it.makingType||'percent';const mkDispVal=mkMode==='percent'?(it.makingPct||it.makingValue||0):mkMode==='fixed_gram'?(it.makingPerGram||it.makingValue||0):0;return{itemId:it.itemId,weight:wt,purity:it.purity,metal:it.metal,makingValue:it.makingValue,makingType:mkMode,makingPct:mkMode==='percent'?mkDispVal:0,makingPerGram:mkMode==='fixed_gram'?mkDispVal:0,costPrice:it.costPrice,sellingPrice:sp,quotePrice:it.quotePrice||0,stonePrice:it.stonePrice||0,itemProfit:iProfit,itemReplProfit:iReplProfit,makingCharged:it.makingCharged||makingAmt,makingAmt,replCost:rc,isBulk:it.isBulk||false,pureRate:pr};
  });
  const invId=genIId();
  S.invoices[invId]={invoiceId:invId,date:sd,customerId:selCust.customerId,custName:selCust.name,customerPhone:selCust.phone,items:iDets,quoted:totalQuote,finalTotal:totalSelling,discount:disc,netPayable,received:r,creditAmount:crAmt,creditDue:crDue,paymentBreakdown:pay,invoiceType:ity,acctgProfit:acP,replProfit:rP,status:'active',isExchange:isExchangeSale,exchangeOldGoldValue:exValFinal,entryTs:new Date().toISOString()};
  BI.forEach(it=>{
    const item=S.items[it.itemId];if(!item)return;
    if(it.isBulk){item.remainingWeight=Math.max(0,(item.remainingWeight||item.weight)-(parseFloat(it.sellWt)||0));if((item.remainingWeight||0)<=0.001)item.status='Sold';}
    else{item.status='Sold';item.invoiceId=invId;}
  });
  if(crAmt>0&&crDue){S.customerCredits.push({id:uid(),customerId:selCust.customerId,invoiceId:invId,custName:selCust.name,date:sd,due:crDue,total:crAmt,paid:0,status:'pending',payments:[]});if(S.customers[selCust.customerId])S.customers[selCust.customerId].creditDue=(S.customers[selCust.customerId].creditDue||0)+crAmt;}
  // Update customer total — full invoice value (cash + advance + scheme used)
  const fullValue=totalSelling;
  if(S.customers[selCust.customerId]){
    S.customers[selCust.customerId].totalPurchases=(S.customers[selCust.customerId].totalPurchases||0)+fullValue;
    S.customers[selCust.customerId].lastPurchaseDate=sd;
  }
  window._lastInv={invId,items:iDets,custName:selCust.name,custPhone:selCust.phone,customerId:selCust.customerId,q:totalQuote,finalTotal:totalSelling,discount:disc,netPayable,r,pay,acP,rP,sd,ity,crAmt,crDue,isExchange:isExchangeSale,exchangeOldGold:null,exchangeRefundAmt:exRefundFinal,exchangeRefundMode:exRefundModeFinal};
  save();toast('✅ Invoice '+invId+' saved! Print below.');updateTopbar();
  const backdateFlag=sd<td()?' ⚠️ BACKDATED':'';
  // Finalise linked schemes
  if(window._pendingSchemeIds&&window._pendingSchemeIds.length){
    window._pendingSchemeIds.forEach(function(sid){
      const sc=(S.goldSchemes||[]).find(function(s){return s.id===sid;});
      if(sc){sc.redeemedInvoice=invId;sc.redeemedDate=sd;sc.status='redeemed';}
    });
    window._pendingSchemeIds=null;
  }
  // Finalise linked advances — mark as used (no cash register entry — already there)
  if(window._pendingAdvIds&&window._pendingAdvIds.length){
    window._pendingAdvIds.forEach(function(aid){
      const adv=(S.advances||[]).find(function(a){return a.id===aid;});
      if(adv){adv.adjustedInInvoice=invId;adv.adjustedDate=sd;}
    });
    window._pendingAdvIds=null;
  }
  // Finalise linked orders — mark delivered ONLY after invoice is saved
  if(window._pendingOrderLinks&&window._pendingOrderLinks.length){
    window._pendingOrderLinks.forEach(function(ol){
      const ord=(S.customOrders||[]).find(function(o){return o.id===ol.orderId;});
      if(ord){
        ord.invoiceId=invId;
        // Only mark delivered if full payment received or credit explicitly set
        var isFullySettled=(r+exValFinal+ol.advanceAmt)>=(ord.estimatedAmt||0)*0.99;
        ord.status=isFullySettled?'delivered':'ready'; // stays ready if partial
        ord.statusHistory=ord.statusHistory||[];
        ord.statusHistory.push({date:sd,status:ord.status,note:'Invoice '+invId+' | Cash: '+fr(r)+' | Adv: '+fr(ol.advanceAmt)+(crAmt>0?' | Credit: '+fr(crAmt):'')});
        aLog('UPDATE','CustomOrder',ord.id,(isFullySettled?'DELIVERED':'PARTIALLY BILLED')+' | Invoice '+invId);
      }
    });
    window._pendingOrderLinks=null;
  }
  // Clear applied credit amounts
  window._appliedAdvAmt=0;
  window._appliedSchemeAmt=0;
  // Remove UI boxes
  ['custBalBox','custOrderBox','appliedDeductBox'].forEach(function(id){var el=document.getElementById(id);if(el)el.remove();});
  aLog('CREATE','Invoice',invId,`Customer: ${selCust.name} | Total: ${fr(totalSelling)} | Received: ${fr(r)}${backdateFlag}`);
  // EXCHANGE: Create old gold/silver record if toggle was checked
  if(isExchangeSale&&exValFinal>0&&exWtFinal>0){
    const exMetal=exMetalFinal;

    if(exMetal==='Gold'){

    // Update _lastInv with full exchange details for printing
    if(window._lastInv){

    };

  }

  }
