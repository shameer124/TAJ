// ═══ PRINT — GST INVOICE WITH PREMIUM DESIGN ════════════════
function openGstModal(){
  const inv=window._lastInv;if(!inv)return toast('No invoice to print','err');
  const rows=(inv.items||[]).map((it,i)=>{
    // FIX B-03/G-01: Use selling-price based metal value for GST consistency
    const mv=Math.max(0,(it.sellingPrice||0)-(it.makingAmt||it.makingCharged||0)-(it.stonePrice||0));
    const defMk=it.makingAmt||it.makingCharged||0;
    const mkMode3=it.makingType||'percent';
    let mkRate='';
    if(mkMode3==='percent')mkRate=(it.makingPct||it.makingValue||0)+'%';
    else if(mkMode3==='fixed_gram')mkRate='₹'+(it.makingPerGram||it.makingValue||0)+'/g';
    else mkRate='₹'+(it.makingCharged||0).toFixed(2);
    const stoneDisp=parseFloat(it.stonePrice)||0;
    return`<tr><td><strong>${it.itemId}</strong>${it.isBulk?' [B]':''}<br><span style="font-size:.65rem;color:var(--mu)">${it.purity}·${(parseFloat(it.weight)||0).toFixed(3)}g·Making:${mkRate}${stoneDisp>0?' | Stone:'+fr(stoneDisp):''}</span></td><td>${fr(mv)}</td><td><input type="number" id="gmk${i}" value="${defMk.toFixed(2)}" step="0.01" min="0" style="width:85px;padding:3px 6px;font-size:.76rem;background:var(--s2);border:1px solid var(--bo);border-radius:var(--r2);color:var(--tx)" oninput="gstPrev()"></td><td id="ggg${i}">—</td><td id="gmg${i}">—</td><td id="gtt${i}" style="font-weight:600;color:var(--gold)">—</td></tr>`;
  }).join('');
  modal('🧾 GST Invoice — Making Charges Pre-filled',`
    <div class="al ai" style="margin-bottom:10px">Making charges auto-filled from item data. Adjust if needed. Metal GST=3% | Making GST=5%</div>
    <div class="tw"><table class="dt"><thead><tr><th>Item</th><th>Metal Value</th><th>Making (₹) ✏️</th><th>Metal GST(3%)</th><th>Making GST(5%)</th><th>Item Total</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div id="gstSumDiv" class="sbox" style="margin-top:10px"></div>`,
  ()=>printGST(),'🖨️ Print GST Invoice');
  setTimeout(gstPrev,100);
}
function gstPrev(){
  const inv=window._lastInv;if(!inv)return;
  let tm=0,tmk=0,tgg=0,tmkg=0;
  (inv.items||[]).forEach((it,i)=>{
    const mk=parseFloat(document.getElementById('gmk'+i)?.value)||0;
    // FIX G-02: Include stone in metal value for GST (composite supply rule)
    // FIX B-03: Use selling-price based metal value for consistency with GST History
    const stone=parseFloat(it.stonePrice)||0;
    const mv=Math.max(0,(it.sellingPrice||0)-mk-stone)+ stone; // stone treated as part of jewellery taxable at 3%
    const gg=(mv+stone)*0.03,mg=mk*0.05;
    const itemTotal=mv+mk+gg+mg+stone;
    tm+=mv;tmk+=mk;tgg+=gg;tmkg+=mg;
    if(document.getElementById('ggg'+i))document.getElementById('ggg'+i).textContent=fr(gg);
    if(document.getElementById('gmg'+i))document.getElementById('gmg'+i).textContent=fr(mg);
    if(document.getElementById('gtt'+i))document.getElementById('gtt'+i).textContent=fr(mv+mk+gg+mg+stone);
    it._gmk=mk;
  });
  const totalStoneGST=(inv.items||[]).reduce((s,it)=>s+(parseFloat(it.stonePrice)||0),0);
  const tc=(tgg+tmkg)/2,ts=tc,grand=tm+tmk+tgg+tmkg+totalStoneGST;
  const s=document.getElementById('gstSumDiv');
  if(s)s.innerHTML=`<div class="sr2"><span class="tm">Metal Value Total</span><span>${fr(tm)}</span></div><div class="sr2"><span class="tm">Making Charges Total</span><span>${fr(tmk)}</span></div><div class="sr2"><span class="tm">Gold/Silver GST (3%)</span><span class="twa">${fr(tgg)}</span></div><div class="sr2"><span class="tm">Making GST (5%)</span><span class="twa">${fr(tmkg)}</span></div><div class="sr2"><span class="tm">Total CGST</span><span>${fr(tc)}</span></div><div class="sr2"><span class="tm">Total SGST</span><span>${fr(ts)}</span></div><div class="sr2 tot"><span>Grand Total (with all GST)</span><span>${fr(grand)}</span></div>`;
}
function printGST(){
  const inv=window._lastInv;if(!inv)return;
  // Merge live invoice data (exchange/credit added after _lastInv was set)
  const liveInv2=S.invoices[inv.invId];
  if(liveInv2){
    if(liveInv2.isExchange&&!inv.isExchange){inv.isExchange=true;inv.exchangeOldGold=liveInv2.exchangeOldGold;inv.exchangeOldGoldValue=liveInv2.exchangeOldGoldValue;}
    if(liveInv2.crAmt&&!inv.crAmt){inv.crAmt=liveInv2.crAmt;inv.crDue=liveInv2.crDue;}
    inv.customerId=inv.customerId||liveInv2.customerId;
    // Ensure pay includes exchange
    if(liveInv2.paymentBreakdown&&(!inv.pay||!inv.pay.exchange)){inv.pay=liveInv2.paymentBreakdown;}
  }
  let tm=0,tmk=0,tgg=0,tmkg=0;
  const logoHtml=S.settings.logoUrl?`<img src="${S.settings.logoUrl}" style="height:55px;margin-bottom:4px;display:block" onerror="this.style.display='none'">`:'<div style="font-size:2.5rem">💎</div>';

    const mk=it._gmk!==undefined?it._gmk:(it.makingAmt||it.makingCharged||0);
    // FIX B-03/G-01: Use selling-price minus making minus stone for metal value
    const mv=Math.max(0,(it.sellingPrice||0)-mk-(it.stonePrice||0));
    const gg=mv*0.03,mg=mk*0.05;
    const mkMode4=it.makingType||'percent';
    let mkRate4='';
    if(mkMode4==='percent')mkRate4=(it.makingPct||it.makingValue||0)+'%';
    else if(mkMode4==='fixed_gram')mkRate4='₹'+(it.makingPerGram||it.makingValue||0)+'/g';
    else mkRate4='₹'+mk.toFixed(2)+' manual';
    const stone4=parseFloat(it.stonePrice)||0;
    tm+=mv;tmk+=mk;tgg+=gg;tmkg+=mg;
    return`<tr><td><strong>${it.itemId}</strong>${it.isBulk?' [B]':''}<br><small>${it.purity} · Making:${mkRate4}${stone4>0?' · Stone:₹'+stone4.toFixed(2):''}</small></td><td>${(parseFloat(it.weight)||0).toFixed(3)}g</td><td>₹${mv.toFixed(2)}</td><td>₹${mk.toFixed(2)}</td><td>₹${(gg/2).toFixed(2)}</td><td>₹${(gg/2).toFixed(2)}</td><td>₹${(mg/2).toFixed(2)}</td><td>₹${(mg/2).toFixed(2)}</td><td><strong>₹${(mv+mk+gg+mg+stone4).toFixed(2)}</strong></td></tr>`;
  }).join('');
  // FIX G-02: Include stone in invoice total (stone attracts 3% GST as part of jewellery composite supply)

// ★ ITEM-WISE RETURN — no proportional logic
function srProc(invoiceId,itemId){
  const inv=S.invoices[invoiceId];if(!inv)return;
  const invItem=inv.items.find(x=>x.itemId===itemId);
  const origItem=S.items[itemId];
  if(!invItem||!origItem)return toast('Item data not found','err');
  // ★ Use per-item selling price if available (new invoices)
  const hasPerItem=(invItem.sellingPrice!==undefined&&invItem.sellingPrice!==null&&parseFloat(invItem.sellingPrice)>0);
  let amtReversed,cashRefund,itemProfit,itemReplProfit;
  if(hasPerItem){
    amtReversed=parseFloat(invItem.sellingPrice)||0;
    itemProfit=parseFloat(invItem.itemProfit)||0;
    itemReplProfit=parseFloat(invItem.itemReplProfit)||0;
    // ★ BUG3 FIX: Refund exactly what was collected for this item (sellingPrice)
    // NOT a proportion of cash — customer paid sellingPrice, so refund sellingPrice
    cashRefund=amtReversed;
  }else{
    // ★ Fallback for old invoices without per-item price — use item cost proportion
    const activeItems=inv.items.filter(x=>!x.returned);
    const totalCost=activeItems.reduce((s,x)=>s+x.costPrice,0)||1;
    const proportion=invItem.costPrice/totalCost;
    amtReversed=(inv.received||0)*proportion;
    cashRefund=(inv.paymentBreakdown?.cash||0)*proportion;
    itemProfit=(inv.acctgProfit||0)*proportion;
    itemReplProfit=(inv.replProfit||0)*proportion;
  }
  modal('Confirm Return — '+itemId,`
    <div class="al ai" style="margin-bottom:9px">Only <strong>${itemId}</strong>'s profit and selling amount will be reversed. All other items in this invoice remain unchanged.</div>
    <div class="sbox" style="margin-bottom:9px">
      <div class="sr2"><span class="tm">Selling Price Reversed</span><span class="fw">${fr(amtReversed)}</span></div>
      <div class="sr2"><span class="tm">Accounting Profit Reversed</span><span class="ter fw">${fr(itemProfit)}</span></div>
      <div class="sr2"><span class="tm">Replacement Profit Reversed</span><span class="ter fw">${fr(itemReplProfit)}</span></div>
      <div class="sr2 tot"><span>Refund to Customer (exact amount collected)</span><span class="ter fw">${fr(cashRefund)}</span></div>
    </div>
    <div class="fg" style="margin-top:8px">
      <label>Refund Payment Mode</label>
      <select id="srMode"><option value="cash">💵 Cash</option><option value="upi">📱 UPI</option><option value="card">💳 Card</option></select>
    </div>
    <p style="font-size:.8rem;color:var(--mu);margin-top:6px">${origItem.isBulk?`Bulk item <strong>${itemId}</strong>: sold weight added back to stock (no new ID).`:`Item <strong>${itemId}</strong> will be marked Returned → new ID issued → back to Available stock.`}</p>`,
  ()=>{
    // ★ BULK FIX: for bulk items, add weight back instead of creating new ID
    let newId;
    if(origItem.isBulk){
      // Just add sold weight back to remaining weight
      const soldWt=parseFloat(invItem.weight||invItem.sellWt)||0;
      S.items[itemId].remainingWeight=(parseFloat(S.items[itemId].remainingWeight)||0)+soldWt;
      S.items[itemId].status='Available'; // ensure it's available again
      newId=itemId; // same ID
    }else{
      // Regular item: mark as returned, create new available item
      S.items[itemId].status='Returned';
      newId=genItemId(origItem.catCode);
      S.items[newId]={...origItem,itemId:newId,status:'Available',source:'sales_return',invoiceId:null,remainingWeight:invItem.weight||origItem.weight,weight:invItem.weight||origItem.weight};
    }
    const retId='SR-'+String((S.salesReturns||[]).length+1).padStart(4,'0');
    const refMode=document.getElementById('srMode')?.value||'cash';
    // Record refund ONLY in salesReturnRefunds — calcCash reads this directly.
    // DO NOT also call flowOut here — that caused double-counting in both
    // calcCash display and register balance. salesReturnRefunds is the single channel.
    if(cashRefund>0.01){
      S.salesReturnRefunds.push({id:uid(),date:td(),amount:cashRefund,invoiceId,itemId,newItemId:newId,mode:refMode});
    }
    S.salesReturns.push({returnId:retId,invoiceId,origItemId:itemId,newItemId:newId,date:td(),amtReversed,cashRefunded:cashRefund,itemProfit,itemReplProfit});
    // ★ Mark item returned in invoice
    inv.items=inv.items.map(x=>x.itemId===itemId?{...x,returned:true}:x);
    // ★ Update invoice status
    const allRet=inv.items.every(x=>x.returned);
    inv.status=allRet?'returned':'partial_return';
    // ★ Update invoice totals — ITEM-SPECIFIC only
    inv.acctgProfit=(inv.acctgProfit||0)-itemProfit;
    inv.replProfit=(inv.replProfit||0)-itemReplProfit;
    inv.quoted=Math.max(0,(inv.quoted||0)-amtReversed);
    inv.received=Math.max(0,(inv.received||0)-cashRefund);
    // Update customer totals
    if(S.customers[inv.customerId])S.customers[inv.customerId].totalPurchases=Math.max(0,(S.customers[inv.customerId].totalPurchases||0)-cashRefund);
    save();toast(`✅ ${retId}: ${itemId} → ${newId}${cashRefund>0.01?' | Refund '+fr(cashRefund)+' deducted':''}`);updateTopbar();PAGES['sales-returns']();
  },'Confirm Return',true);
}

      <button class="btn bd bfull" style="margin-top:7px" onclick="prConf('${id}')">↩ Return to Vendor</button>

function prConf(id){
  const item=S.items[id];
  const vid=item.vendorId;
  // ★ FIX 4: Reverse payment exactly matching original payment type
  if(item.payType==='spot'){
    // Spot: money comes back into our register
    const refMode=document.getElementById('prRefundMode')?.value||'cash';
    flowIn(td(),item.costPrice,refMode,'purchase_return','Return refund: '+id+' from '+(S.vendors[vid]?.name||vid),item.metal||'General');
    toast(`💵 ${fr(item.costPrice)} added back to ${refMode.toUpperCase()} register`);
  }else if(vid&&item.payType==='cash_credit'){
    // Cash credit: reduce vendor ledger
    const vl=getVL(vid);
    vl.cashEntries.push({id:uid(),date:td(),catCode:item.catCode,amount:-item.costPrice,note:'Purchase Return: '+id});
  }else if(vid&&item.payType==='pure_credit'){
    // Pure credit: reduce vendor's pure weight owed
    const vl=getVL(vid);
    const g=calcGrams(item.purity,item.weight,item.makingValue,item.makingType);
    if(item.metal==='Gold')vl.goldEntries.push({id:uid(),date:td(),catCode:item.catCode,grams:-g,note:'Purchase Return: '+id});
    else vl.silverEntries.push({id:uid(),date:td(),catCode:item.catCode,grams:-g,note:'Purchase Return: '+id});
  }
  if(item.isBulk){
    // Bulk: only subtract the full remaining weight (return all remaining)
    const retWt=parseFloat(item.remainingWeight)||parseFloat(item.weight)||0;
    S.items[id].remainingWeight=0;
    S.items[id].status='Returned';
    S.purchaseReturns.push({id:uid(),itemId:id,vendorId:vid,date:td(),returnedWeight:retWt,reason:document.getElementById('prR')?.value||''});
  }else{
    S.items[id].status='Returned';
    S.purchaseReturns.push({id:uid(),itemId:id,vendorId:vid,date:td(),reason:document.getElementById('prR')?.value||''});
  }
  save();toast(`✅ ${id} returned. Vendor ledger updated.`);PAGES['purchase-returns']();
}

function ogbCalc(){const w=parseFloat(document.getElementById('ogbw')?.value)||0,p=parseFloat(document.getElementById('ogbp')?.value)||0;if(w&&p){document.getElementById('ogbpw').style.display='block';document.getElementById('ogbpwd').textContent=`Pure Weight: ${fg(w*p/100)} g`;}else document.getElementById('ogbpw').style.display='none';}
function ogBuySv(){
  const d=document.getElementById('ogbd').value,m=document.getElementById('ogbm').value;
  const w=parseFloat(document.getElementById('ogbw').value),p=parseFloat(document.getElementById('ogbp').value);
  const pr=parseFloat(document.getElementById('ogbpr').value);
  const mode=document.getElementById('ogbmode').value;
  if(!w||!p||!pr)return toast('Fill required fields: weight, purity, price','err');
  const id=genOGId();
  // FIX BUG-08: Silver should ONLY go to oldSilverPool, NOT to oldGold report too.
  // Gold goes to S.oldGold. Silver goes ONLY to S.oldSilverPool.
  if(m==='Gold'){
    S.oldGold.push({oldGoldId:id,type:'buy',date:d,metal:m,purity:p,weight:w,pureWt:w*(p/100),pricePaid:pr,sellingPrice:0,profit:0,status:'available',customer:document.getElementById('ogbcust').value,description:document.getElementById('ogbdesc')?.value||'',notes:'',payMode:mode});
  }else{
    // Silver — only add to silver pool
    if(!S.oldSilverPool)S.oldSilverPool=[];
    S.oldSilverPool.push({id:uid(),date:d,custName:document.getElementById('ogbcust').value||'Customer',grams:w,purity:p,agreedValue:pr,mode,status:'pool',sourceType:'buy',sourceId:id});
    toast('✅ '+id+' added to Silver Pool. Register updated.');
  }
  flowOut(d,pr,mode,'old_gold_buy','Old '+m+' bought from '+(document.getElementById('ogbcust').value||'customer'),m);
  save();toast('✅ '+id+' purchased. Register updated.');updateTopbar();PAGES['old-gold']();
}

    if(!sp)return toast('Enter selling price','err');

    const idx=S.oldGold.findIndex(x=>x.oldGoldId===ogId);
    if(idx>=0)S.oldGold[idx]={...S.oldGold[idx],status:'sold',sellingPrice:sp,profit:sp-r.pricePaid,soldDate:td(),soldTo:document.getElementById('ogsbuyer').value};
    flowIn(td(),sp,mode,'old_gold_sell','Sold old '+r.metal+' '+(document.getElementById('ogsbuyer').value||''),r.metal||'Gold');

// ✏️ Edit selling price of already-sold old gold (works on existing backup data too)
function ogEditSell(ogId){
  const r=S.oldGold.find(x=>x.oldGoldId===ogId);
  if(!r)return toast('Not found','err');
  if(r.status!=='sold')return toast('Item not sold yet — use Sell button','err');
  modal('✏️ Edit Sell Price — '+ogId,`
    <div class="sbox" style="margin-bottom:10px">
      <div class="sr2"><span class="tm">Metal</span><span>${r.metal}</span></div>
      <div class="sr2"><span class="tm">Originally Paid</span><span class="twa fw">${fr(r.pricePaid)}</span></div>
      <div class="sr2"><span class="tm">Recorded Sell Price</span><span class="tsc fw">${fr(r.sellingPrice||0)}</span></div>
      <div class="sr2"><span class="tm">Recorded Profit</span><span class="${(r.profit||0)>=0?'tsc':'ter'} fw">${fr(r.profit||0)}</span></div>
    </div>
    <div class="al aw" style="font-size:.74rem;margin-bottom:8px">Cash register will be corrected by the difference automatically.</div>
    <div class="fg"><label>Corrected Selling Price (₹) *</label><input type="number" id="ogeditprice" step="0.01" value="${r.sellingPrice||0}"></div>`,
  ()=>{
    const newSP=parseFloat(document.getElementById('ogeditprice').value)||0;
    if(!newSP)return toast('Enter correct selling price','err');
    const oldSP=r.sellingPrice||0;
    const diff=newSP-oldSP;
    const idx=S.oldGold.findIndex(x=>x.oldGoldId===ogId);
    if(idx>=0){S.oldGold[idx].sellingPrice=newSP;S.oldGold[idx].profit=newSP-r.pricePaid;}
    // Correct cash register — add/remove the difference on the sold date
    const sDate=r.soldDate||td();
    if(diff>0.01) flowIn(sDate,diff,'cash','old_gold_sell_edit','Edit correction +'+fr(diff)+' for '+ogId,r.metal||'Gold');
    else if(diff<-0.01) flowOut(sDate,Math.abs(diff),'cash','old_gold_sell_edit','Edit correction '+fr(diff)+' for '+ogId,r.metal||'Gold');
    aLog('EDIT','OldGold',ogId,'Sell price: '+fr(oldSP)+' → '+fr(newSP));
    save();toast('✅ Sell price updated! New profit: '+fr(newSP-r.pricePaid));
    PAGES['old-gold']();
  },'Save Correction');
}

function ogeProceedToBilling(){
  // Validate Step 1 fields
  const d=document.getElementById('oged')?.value;
  const m=document.getElementById('ogem')?.value||'Gold';
  const w=parseFloat(document.getElementById('ogew')?.value)||0;
  const p=parseFloat(document.getElementById('ogep')?.value)||0;
  const ogVal=parseFloat(document.getElementById('ogeval')?.value)||0;

  const custName=document.getElementById('ogecust')?.value||'Exchange Customer';
  if(!w||!p||!ogVal)return toast('Fill old metal weight, purity and agreed value first','err');
  if(!d)return toast('Select exchange date','err');

  setTimeout(function(){bLoadExchange();},200);

function ogeConfirm(){
  const d=document.getElementById('oged').value,m=document.getElementById('ogem').value;
  const w=parseFloat(document.getElementById('ogew').value),p=parseFloat(document.getElementById('ogep').value);
  const ogVal=parseFloat(document.getElementById('ogeval').value),newPrice=parseFloat(document.getElementById('ogeNewPrice').value);
  const payMode=document.getElementById('ogePayMode').value;
  if(!w||!p||!ogVal||!newPrice||!ogeSelItem)return toast('Fill all required fields and select a new item','err');
  const rate=S.rates[d];if(!rate)return toast('No rate for exchange date. Enter in Rate Master.','err');
  const diff=newPrice-ogVal;
  const it=ogeSelItem;
  const custName=document.getElementById('ogecust').value||'Exchange Customer';
  const pr=pRate(it.metal,rate),rc=calcCost(it.purity,it.weight,it.makingValue,it.makingType,pr);
  const acP=newPrice-it.costPrice,rP=newPrice-rc;
  const pay={cash:0,upi:0,card:0,cheque:0};
  if(diff>0.01)pay[payMode]=diff;
  const invId=genIId();
  const ogDetails={metal:m,weight:w,purity:p,pureWt:w*(p/100),agreedValue:ogVal,customer:custName};
  const mkMode=it.makingType||'percent';
  const prPurity=purityRateVal(it.metal,it.purity,rate);
  const mkAmt=calcMakingAmount(it.weight,it.makingValue,mkMode,prPurity);
  const exItem={itemId:it.itemId,weight:it.weight,purity:it.purity,metal:it.metal,
    makingValue:it.makingValue,makingType:mkMode,
    makingMode:mkMode,
    makingPct:mkMode==='percent'?(it.makingValue||0):0,
    makingPerGram:mkMode==='fixed_gram'?(it.makingValue||0):0,
    makingCharged:mkAmt,makingAmt:mkAmt,
    costPrice:it.costPrice,sellingPrice:newPrice,
    quotePrice:newPrice,stonePrice:0,
    itemProfit:acP,itemReplProfit:rP,
    replCost:rc,isBulk:false,pureRate:pr};
  // FIX B-02: Link to actual customer if selected
  const exCustId=document.getElementById('ogeCustId')?.value||'';
  // FIX B-01: received = cash actually collected (diff), not full item price
  const exReceived=Math.max(0,diff);
  S.invoices[invId]={invoiceId:invId,date:d,customerId:exCustId,custName,customerPhone:exCustId&&S.customers[exCustId]?S.customers[exCustId].phone:'',
    items:[exItem],
    quoted:newPrice,received:exReceived,discount:0,creditAmount:0,creditDue:'',paymentBreakdown:pay,
    invoiceType:'simple',acctgProfit:acP,replProfit:rP,status:'active',isExchange:true,
    exchangeOldGoldValue:ogVal,exchangeOldGold:ogDetails,netExchangeAmount:diff};
  // Update customer purchase record if linked
  if(exCustId&&S.customers[exCustId]){
    S.customers[exCustId].totalPurchases=(S.customers[exCustId].totalPurchases||0)+exReceived;
    S.customers[exCustId].lastPurchaseDate=d;
  }
  S.items[it.itemId].status='Sold';S.items[it.itemId].invoiceId=invId;
  const ogId=genOGId();
  // Only push to oldGold if metal is GOLD. Silver goes to silver pool only.
  if(m==='Gold'){
    S.oldGold.push({oldGoldId:ogId,type:'exchange_buy',date:d,metal:m,purity:p,weight:w,pureWt:w*(p/100),pricePaid:ogVal,status:'available',exchangeInvoiceId:invId,customer:custName});
  }
  // Silver from exchange → Silver Pool ONLY (same as direct silver buy)
  if(m==='Silver'){
    if(!S.oldSilverPool)S.oldSilverPool=[];
    S.oldSilverPool.push({id:uid(),date:d,custName,grams:w,purity:p,agreedValue:ogVal,mode:payMode,status:'pool',sourceType:'exchange',sourceId:ogId,exchangeInvoiceId:invId});
  }
  // NOTE: exchange_in diff is already captured via invoice.paymentBreakdown above (calcCash reads invoices).
  // Only record exchange_out (shop pays customer) — that is NOT in any invoice paymentBreakdown.
  if(diff<-0.01)flowOut(d,Math.abs(diff),payMode,'exchange_out','Exchange: shop paid customer diff for '+invId,'Gold');
  window._lastInv={invId,items:[exItem],custName,custPhone:exCustId&&S.customers[exCustId]?S.customers[exCustId].phone:'',q:newPrice,r:exReceived,pay,acP,rP,sd:d,ity:'simple',isExchange:true,exchangeOldGold:ogDetails,diff,crAmt:0,crDue:''};
  var exchMsg=Math.abs(diff)<0.01?'Full exchange.':diff>0?'Customer paid '+fr(diff):'You paid customer '+fr(Math.abs(diff));save();toast('Exchange done! Invoice '+invId+'. '+exchMsg);
  updateTopbar();ogeSelItem=null;PAGES['old-gold']();
}

      gramsSettled=ca/pr;

function crCollect(id){
  const c=(S.customerCredits||[]).find(x=>x.id===id);
  if(!c)return toast('Credit not found','err');
  const rem=c.total-(c.paid||0);
  const amt=parseFloat(document.getElementById('crPay_'+id)?.value)||0;
  // FIX #4: Read actual payment mode instead of hardcoding 'cash'
  const mode=document.getElementById('crMode_'+id)?.value||'cash';
  if(amt<=0)return toast('Enter amount to collect','err');
  if(amt>rem+0.01)return toast('Amount exceeds remaining balance: '+fr(rem),'err');
  c.paid=(c.paid||0)+amt;
  c.payments=c.payments||[];
  c.payments.push({date:td(),amount:amt,mode});
  if(c.paid>=c.total-0.01)c.status='paid';
  if(S.customers[c.customerId])S.customers[c.customerId].creditDue=Math.max(0,(S.customers[c.customerId].creditDue||0)-amt);
  // Infer metal from invoice for register split
  const crInvMetal=(()=>{
    const inv=c.invoiceId?S.invoices[c.invoiceId]:null;
    if(!inv)return'General';
    const items=inv.items||[];
    const gAmt=items.filter(i=>i.metal==='Gold').reduce((s,i)=>s+(i.sellingPrice||0),0);
    const sAmt=items.filter(i=>i.metal==='Silver').reduce((s,i)=>s+(i.sellingPrice||0),0);
    if(gAmt>0&&sAmt===0)return'Gold';
    if(sAmt>0&&gAmt===0)return'Silver';
    return'General';
  })();
  flowIn(td(),amt,mode,'credit_collection','Credit collected from '+c.custName+' for inv '+c.invoiceId,crInvMetal);
  aLog('COLLECT','CustomerCredit',c.id,`${fr(amt)} via ${mode} from ${c.custName} for ${c.invoiceId}`);
  // FIX BUG-12: Update inv.received directly by adding collected amount only.
  // DO NOT call recalcInvoiceProfit() here — that function would re-sum paymentBreakdown
  // and double-count. Just add the newly collected amount directly.
  if(c.invoiceId&&S.invoices[c.invoiceId]){
    S.invoices[c.invoiceId].received=(S.invoices[c.invoiceId].received||0)+amt;
  }
  save();toast('✅ '+fr(amt)+' collected from '+c.custName+' via '+mode.toUpperCase());
  go('customer-credits');
}

  const MODES=['cash','upi','card','cheque'];
  const ICONS={cash:'💵',upi:'📱',card:'💳',cheque:'🏦'};

  function modeCards(cf,metal){
    return`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px">
      ${MODES.map(m=>`<div class="kc">
        <div class="kl">${ICONS[m]} ${m.toUpperCase()}</div>

        <div style="border-top:1px solid var(--bo);margin-top:4px;padding-top:4px">

    <div class="sbox"><div class="sr2 tot"><span>Total ${metal} (Cash+UPI+Card+Cheque)</span><span>${fr(cf.totalNet)}</span></div></div>`;
  }

  function flowTable(metal){
    const rows=[];
    // IN from invoices — proportional
    Object.values(S.invoices).filter(i=>i.date===today&&i.status!=='returned').forEach(inv=>{
      const items=inv.items||[];
      const totalSP=items.reduce((s,it)=>s+(parseFloat(it.sellingPrice)||0),0);
      const metalSP=items.filter(it=>it.metal===metal).reduce((s,it)=>s+(parseFloat(it.sellingPrice)||0),0);
      const ratio=totalSP>0?metalSP/totalSP:0;
      if(ratio<=0)return;
      MODES.forEach(m=>{
        const a=(inv.paymentBreakdown?.[m]||0)*ratio;
        if(a>0.01)rows.push({dir:'in',type:'Sale',desc:inv.invoiceId+' — '+inv.custName,mode:m,amt:a});
      });
    });
    // IN from allFlowsIn
    (S.allFlowsIn||[]).filter(f=>f.date===today&&f.type!=='sale'&&(f.metal||'General')===metal).forEach(f=>{
      rows.push({dir:'in',type:f.type.replace(/_/g,' '),desc:(f.desc||'').slice(0,40),mode:f.mode,amt:f.amount});

    // OUT from allFlowsOut

function closeRegister(metal){
  if(!S.rates[td()])return toast('Enter today\'s rate first!','warn');
  const MODES=['cash','upi','card','cheque'];
  const pre=metal.toLowerCase();
  const physical={};
  MODES.forEach(m=>{physical[m]=parseFloat(document.getElementById('phys_'+pre+'_'+m)?.value)||0;});
  if(!S.cashReg[td()])S.cashReg[td()]={};
  S.cashReg[td()][pre+'Closed']=true;
  S.cashReg[td()][pre+'Physical']=physical;
  // Carry forward to tomorrow as opening for this metal
  const tom=addDays(td(),1);
  if(!S.cashReg[tom])S.cashReg[tom]={};
  const obKey=pre+'Opening';
  S.cashReg[tom][obKey]={};
  MODES.forEach(m=>{S.cashReg[tom][obKey][m]=physical[m];});
  // Also update calcCashMetal opening source
  MODES.forEach(m=>{S.cashReg[tom][pre+'Opening'+m.charAt(0).toUpperCase()+m.slice(1)]=physical[m];});
  save();toast('✅ '+metal+' Register closed! Tomorrow opens with your physical counts.');
  PAGES['cash-register']();
}

function closeDay(){
  if(!S.rates[td()])return toast('Enter today\'s rate first!','warn');
  const MODES=['cash','upi','card','cheque'];
  const physical={};
  MODES.forEach(m=>{physical[m]=parseFloat(document.getElementById('phys_'+m)?.value)||0;});
  S.cashReg[td()]={...S.cashReg[td()],physical,closed:true};
  const tom=addDays(td(),1);
  if(!S.cashReg[tom])S.cashReg[tom]={};
  MODES.forEach(m=>{
    S.cashReg[tom]['opening'+m.charAt(0).toUpperCase()+m.slice(1)]=physical[m];
  });
  S.cashReg[tom].openingCash=physical.cash;S.cashReg[tom].openingUpi=physical.upi;
  S.cashReg[tom].openingCard=physical.card;S.cashReg[tom].openingCheque=physical.cheque;
  S.lastDayClose={date:td(),physical};
  const autoBackup=confirm('✅ Day closed!\n\nDownload backup now?\n(Recommended: daily)');
  if(autoBackup)doBk();
  save();toast('✅ Day closed! Tomorrow opens with your physical counts.');PAGES['cash-register']();
}

function doTransfer(){
  const from=document.getElementById('txFrom').value;
  const to=document.getElementById('txTo').value;
  const amt=parseFloat(document.getElementById('txAmt').value)||0;
  const mode=document.getElementById('txMode').value;
  const note=document.getElementById('txNote').value;
  if(!amt)return toast('Enter amount','err');
  if(from===to)return toast('From and To cannot be same register','err');
  if(!note)return toast('Enter reason for transfer','err');
  // OUT from source register, IN to destination register — same amount, same date
  flowOut(td(),amt,mode,'register_transfer','Transfer to '+to+' Register: '+note,from);
  // flowIn with extra field fromMetal for display
  S.allFlowsIn.push({id:uid(),date:td(),amount:amt,mode,type:'register_transfer',desc:note,metal:to,fromMetal:from});
  save();toast('✅ ₹'+amt.toFixed(2)+' transferred from '+from+' → '+to+' Register');
  updateTopbar();PAGES['cash-register']();
}

function saveOpeningBalance(){
  const MODES=['cash','upi','card','cheque'];
  if(!S.cashReg[td()])S.cashReg[td()]={};
  const goldOB={},silvOB={};
  MODES.forEach(m=>{
    goldOB[m]=parseFloat(document.getElementById('ob_gold_'+m)?.value)||0;
    silvOB[m]=parseFloat(document.getElementById('ob_silv_'+m)?.value)||0;
  });
  S.cashReg[td()].goldOpening=goldOB;
  S.cashReg[td()].silverOpening=silvOB;
  // Also set legacy fields for combined view
  const totCash=(goldOB.cash||0)+(silvOB.cash||0);
  S.cashReg[td()].openingCash=totCash;
  S.cashReg[td()].openingUpi=(goldOB.upi||0)+(silvOB.upi||0);
  S.cashReg[td()].openingCard=(goldOB.card||0)+(silvOB.card||0);
  S.cashReg[td()].openingCheque=(goldOB.cheque||0)+(silvOB.cheque||0);
  // Store separate metal opening for calcCashMetal
  MODES.forEach(m=>{
    S.cashReg[td()]['goldOpening'+m.charAt(0).toUpperCase()+m.slice(1)]=goldOB[m];
    S.cashReg[td()]['silverOpening'+m.charAt(0).toUpperCase()+m.slice(1)]=silvOB[m];
  });
  save();toast('✅ Opening balances saved for Gold and Silver registers!');updateTopbar();
  PAGES['cash-register']();
}

function profitKgHtml(aInvs,exps,ogP,spStats,label){

// Helper: get silver pool stats for a date range
function spoolStats(from,to){
  const pool=S.oldSilverPool||[];
  // Silver paid to customers (inflow cost to shop) within date range
  const inflow=pool.filter(e=>e.date>=from&&e.date<=to).reduce((s,e)=>s+(e.agreedValue||0),0);
  const count=pool.filter(e=>e.date>=from&&e.date<=to).length;
  // Silver given to vendor — read from vendor ledger silverEntries where grams < 0 (given)
  // Those entries reduce vendor credit so shop SAVES that much cash — show as value received
  let outflow=0;
  Object.values(S.vendors||{}).forEach(v=>{
    (v.silverEntries||[]).forEach(e=>{
      if(e.date>=from&&e.date<=to&&e.grams<0){
        // Grams given × current silver rate as approximate value
        const rate=S.rates[e.date]||S.rates[td()]||{};
        outflow+=Math.abs(e.grams)*(rate.silver||0);
      }
    });
  });
  return{inflow,outflow,count};

function logoUpload(input){
  const file=input.files[0];if(!file)return;
  if(file.size>500000)return toast('Logo too large — max 500KB','err');
  const reader=new FileReader();
  reader.onload=e=>{S.settings.logoUrl=e.target.result;save();toast('✅ Logo uploaded!');PAGES['settings']();};
  reader.readAsDataURL(file);
}
function clearLogo(){S.settings.logoUrl='';save();toast('Logo removed');PAGES['settings']();}
function clearAll(){modal('⚠️ FACTORY RESET — THIS CANNOT BE UNDONE',`<div class="al ae">This will permanently delete ALL data: items, invoices, customers, vendors, expenses, credits, rates. Your ERP will be completely blank.<br><br>Make a backup FIRST from the Backup page!</div>`,()=>{const pw=prompt('Type your password to confirm reset:');if(pw!==S.settings.password)return toast('Wrong password — reset cancelled','err');const keep={shopName:S.settings.shopName,phone:S.settings.phone,address:S.settings.address,gstNo:S.settings.gstNo,password:S.settings.password,logoUrl:S.settings.logoUrl||''};Object.assign(S,JSON.parse(JSON.stringify(DEF)));S.settings=keep;save();toast('✅ Factory reset done');PAGES['dashboard']();},'YES — ERASE EVERYTHING',true);}
function saveSettings(){
  const cur=document.getElementById('setCurP').value;
  const nw=document.getElementById('setNewP').value;
  const spw=document.getElementById('sStaffPw')?document.getElementById('sStaffPw').value:'';
  const ownerStored=S.settings.password||'';
  function doSave(curOk){
    if(!curOk)return toast('Owner password incorrect','err');
    S.settings.shopName=document.getElementById('setName').value;
    S.settings.phone=document.getElementById('setPhone').value;
    S.settings.address=document.getElementById('setAddr').value;
    S.settings.gstNo=document.getElementById('setGst').value;
    function finishSave(){
    S.settings.labelWidth=parseFloat(document.getElementById('setLW')?.value)||50;
    S.settings.labelHeight=parseFloat(document.getElementById('setLH')?.value)||25;
    save();toast('Settings saved!');buildSB();PAGES['settings']();
  }
    if(nw&&spw){
      hashPw(nw).then(function(ho){S.settings.password=ho;
        hashPw(spw).then(function(hs){S.settings.staffPassword=hs;finishSave();});
      });
    }else if(nw){
      hashPw(nw).then(function(ho){S.settings.password=ho;finishSave();});
    }else if(spw){
      hashPw(spw).then(function(hs){S.settings.staffPassword=hs;finishSave();});
    }else{
      finishSave();
    }
  }
  if(ownerStored.startsWith('sha256:')){
    hashPw(cur).then(function(h){doSave(h===ownerStored);});
  }else{
    doSave(cur===ownerStored);
  }
}

PAGES['gst-history']=function(){
  // Purchase GST: items with inputGST set
  const purchGST=Object.values(S.items).filter(i=>i.inputGST&&i.inputGST.gstAmt>0).sort((a,b)=>b.entryDate.localeCompare(a.entryDate));
  // Sales GST: invoices with invoiceType='gst'
  const salesGST=Object.values(S.invoices).filter(i=>i.invoiceType==='gst').sort((a,b)=>b.date.localeCompare(a.date));
  const totalPurchGST=purchGST.reduce((s,i)=>s+(i.inputGST.gstAmt||0),0);
  const totalSalesGST=salesGST.reduce((s,i)=>{
    // FIX: Metal value → 3% GST, Making charges → 5% GST (per Indian GST rules for jewellery)
    const totalMaking=(i.items||[]).reduce((ms,it)=>ms+(it.makingCharged||it.makingAmt||0),0);
    const metalVal=(i.received||0)-totalMaking;
    const gstOnMetal=Math.max(0,metalVal)*(3/100);
    const gstOnMaking=Math.max(0,totalMaking)*(5/100);
    return s+gstOnMetal+gstOnMaking;
  },0);
  document.getElementById('pg').innerHTML=`
    <div class="ph"><h1>🧾 GST History</h1><p>Purchase input GST and Sales output GST records for filing.</p></div>
    <div class="kg">
      <div class="kc gb"><div class="kl">Total Input GST (Purchases)</div><div class="kv tsc">${fr(totalPurchGST)}</div><div class="ks">${purchGST.length} GST invoices</div></div>
      <div class="kc"><div class="kl">Total Output GST (Sales)</div><div class="kv twa">${fr(totalSalesGST)}</div><div class="ks">${salesGST.length} GST bills</div></div>
      <div class="kc"><div class="kl">Net GST Payable</div><div class="kv ${totalSalesGST-totalPurchGST>0?'ter':'tsc'}">${fr(Math.abs(totalSalesGST-totalPurchGST))}</div><div class="ks">${totalSalesGST-totalPurchGST>0?'Payable to Govt':'Input Credit Available'}</div></div>
    </div>
    <div class="tabs">
      <button class="tb on" onclick="stab('gstPurch',this)">📥 Purchase GST (${purchGST.length})</button>
      <button class="tb" onclick="stab('gstSales',this)">📤 Sales GST (${salesGST.length})</button>
    </div>
    <div class="tp on" id="gstPurch">
      <div class="card">
        <div class="ct">Purchase Input GST Records</div>
        ${tbl(
          ['Date','Item ID','Vendor','Category','Base Price','GST %','GST Amt','Total','Pay Type'],
          purchGST.map(i=>{
            const v=S.vendors[i.vendorId];
            return[
              fmt(i.entryDate),
              `<span class="tgo fw">${i.itemId}</span>`,
              v?v.name:'—',
              i.catCode,
              fr(i.inputGST.basePrice||i.baseCost||i.costPrice),
              (i.inputGST.gstPct||0)+'%',
              `<span class="tsc fw">${fr(i.inputGST.gstAmt)}</span>`,
              fr(i.inputGST.totalWithGST||i.costPrice),
              `<span class="b2 bin">${(i.payType||'').replace(/_/g,' ').toUpperCase()}</span>`
            ];
          }),
          'No GST purchase records yet. Check the GST checkbox when adding purchases.'
        )}
      </div>
    </div>
    <div class="tp" id="gstSales">
      <div class="card">
        <div class="ct">Sales Output GST Bills</div>
        ${tbl(
          ['Date','Invoice','Customer','Items','Metal Val + Making','GST (3%+5%)','Total with GST'],
          salesGST.map(inv=>{
            const totalMaking=(inv.items||[]).reduce((s,it)=>s+(it.makingCharged||it.makingAmt||0),0);
            const metalVal=Math.max(0,(inv.received||0)-totalMaking);
            const gstMetal=metalVal*(3/100);
            const gstMaking=Math.max(0,totalMaking)*(5/100);
            const totalGst=gstMetal+gstMaking;
            return[
              fmt(inv.date),
              `<span class="tgo fw">${inv.invoiceId}</span>`,
              inv.custName||'—',
              (inv.items||[]).length,
              `${fr(metalVal)} <span class="tm" style="font-size:.68rem">+ mkng ${fr(totalMaking)}</span>`,
              `<span class="twa fw">${fr(gstMetal)}</span> + <span class="twa">${fr(gstMaking)}</span>`,
              fr((inv.received||0)+totalGst)
            ];
          }),
          'No GST sales bills yet. Use "GST Invoice" type when saving a sale.'
        )}
      </div>
    </div>`;
};

function doBk(){
  const json=JSON.stringify({version:'5.0',shopName:S.settings.shopName,date:new Date().toISOString(),data:S},null,2);
  const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');const d=new Date();
  a.href=url;a.download=`TAJ_Backup_${d.getDate()}${MO[d.getMonth()]}${d.getFullYear()}.json`;
  a.click();URL.revokeObjectURL(url);
  // FIX BUG-20: Record backup date so banner disappears after backup
  S.settings.lastBackupDate=td();save();
  const banner=document.getElementById('bkBanner');if(banner){banner.remove();const pg=document.getElementById('pg');if(pg)pg.style.paddingTop='';}
  toast('✅ Backup downloaded! Save it to pen drive or Google Drive.');
}
let rfData=null;
function rfPrev(){
  const f=document.getElementById('rfFile').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);rfData=d;const recs=Object.values(d.data?.items||{}).length+Object.values(d.data?.invoices||{}).length;document.getElementById('rfPrev2').style.display='block';document.getElementById('rfInfo').textContent=`${f.name} | ~${recs} records | Exported: ${new Date(d.date).toLocaleString('en-IN')}`;document.getElementById('rfBtn').disabled=false;}catch(err){toast('Cannot read file: '+err.message,'err');}};
  r.readAsText(f);
}
function doRst(){
  if(!rfData)return;
  modal('⚠️ Final Warning — Cannot Undo',`<div class="al ae">This will PERMANENTLY REPLACE all current data with the backup data. There is NO undo.</div><p style="margin-top:8px">Are you absolutely sure you want to restore?</p>`,
  ()=>{
    if(!rfData.data)return toast('Invalid backup file','err');
    Object.keys(rfData.data).forEach(k=>{S[k]=rfData.data[k];});
    ['customerCredits','expenses','oldGold','salesReturns','purchaseReturns','allFlowsIn','allFlowsOut','salesReturnRefunds','oldGoldCashOuts','oldGoldCashIns','exchangeCashFlows'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});
    if(typeof S.vendorLedgers!=='object'||Array.isArray(S.vendorLedgers))S.vendorLedgers={};
    if(typeof S.weightThresholds!=='object'||Array.isArray(S.weightThresholds))S.weightThresholds={};
    // ── AUTO-TAG existing flows with metal if missing ────────
    const goldFlowTypes=['spot_purchase','gst_purchase','old_gold_buy','old_gold_sell','exchange_buy','exchange_out','vendor_payment','vendor_pure_payment','karigar_making','scheme_collection','scheme_refund','hallmarking','old_gold_sell_edit'];
    const silverFlowTypes=['old_silver_buy','old_silver_give'];
    let tagCount=0;
    (S.allFlowsIn||[]).forEach(f=>{
      if(!f.metal||f.metal==='General'){
        if(silverFlowTypes.includes(f.type)){f.metal='Silver';tagCount++;}
        else if(goldFlowTypes.includes(f.type)){f.metal='Gold';tagCount++;}
        else{
          // Try to infer from invoice
          if(f.type==='credit_collection'){
            const inv=Object.values(S.invoices||{}).find(i=>f.desc&&f.desc.includes(i.invoiceId));
            if(inv){const gAmt=(inv.items||[]).filter(i=>i.metal==='Gold').reduce((s,i)=>s+(i.sellingPrice||0),0);
            const sAmt=(inv.items||[]).filter(i=>i.metal==='Silver').reduce((s,i)=>s+(i.sellingPrice||0),0);
            if(gAmt>0&&sAmt===0){f.metal='Gold';tagCount++;}else if(sAmt>0&&gAmt===0){f.metal='Silver';tagCount++;}}
          }
        }
      }
    });
    (S.allFlowsOut||[]).forEach(f=>{
      if(!f.metal||f.metal==='General'){
        if(silverFlowTypes.includes(f.type)){f.metal='Silver';tagCount++;}
        else if(goldFlowTypes.includes(f.type)){f.metal='Gold';tagCount++;}
      }
    });
    // Tag expenses without metal as Gold (most common in jewellery shops)
    (S.expenses||[]).forEach(e=>{if(!e.metal)e.metal='Gold';});
    // Find all Available bulk items grouped by catCode
    const bulkByCat={};
    Object.values(S.items).filter(it=>it.isBulk&&it.status==='Available').forEach(it=>{
      if(!bulkByCat[it.catCode])bulkByCat[it.catCode]=[];
      bulkByCat[it.catCode].push(it);
    });
    let mergeCount=0;
    Object.keys(bulkByCat).forEach(cc=>{
      const group=bulkByCat[cc];
      if(group.length<=1)return; // nothing to merge
      // Sort by entryDate, keep oldest as master
      group.sort((a,b)=>(a.entryDate||'').localeCompare(b.entryDate||''));
      const master=group[0];
      const newId=cc+'-BULK';
      // Merge all into master
      let totalWt=0,totalCost=0,totalRemWt=0,blendedRate=0;
      group.forEach(it=>{
        totalWt+=it.weight||0;
        totalCost+=it.costPrice||0;
        totalRemWt+=(it.remainingWeight||it.weight||0);
        blendedRate+=((it.pureRate||0)*(it.weight||0));
      });
      blendedRate=totalWt>0?blendedRate/totalWt:0;
      // Remove old entries
      group.forEach(it=>{if(it.itemId!==newId)delete S.items[it.itemId];});
      // Create/update master with new ID
      delete S.items[master.itemId];
      S.items[newId]={...master,itemId:newId,weight:totalWt,remainingWeight:totalRemWt,costPrice:totalCost,blendedCostPerGram:totalWt>0?totalCost/totalWt:0,pureRate:blendedRate,isBulk:true};
      mergeCount++;
    });
    // Also fix any existing -BULK IDs to match new format
    Object.values(S.items).filter(it=>it.isBulk&&it.status==='Available'&&!it.itemId.endsWith('-BULK')).forEach(it=>{
      const newId=it.catCode+'-BULK';
      if(!S.items[newId]){S.items[newId]={...it,itemId:newId};delete S.items[it.itemId];}
    });
    save();
    const mergeMsg=mergeCount>0?` Auto-merged ${mergeCount} bulk categories.`:'';
    const tagMsg=tagCount>0?` Tagged ${tagCount} old transactions to Gold/Silver registers.`:'';
    toast('✅ Restore complete!'+mergeMsg+tagMsg);
    setTimeout(()=>PAGES['dashboard'](),600);
  },'YES — Replace All Data',true);
}

function kgIssue(){

  const date=document.getElementById('kgDate').value;
  const wt=parseFloat(document.getElementById('kgWt').value);
  const purity=parseFloat(document.getElementById('kgPurity').value)||91.6;
  const desc=document.getElementById('kgDesc').value.trim();
  const exp=document.getElementById('kgExp').value;
  const making=parseFloat(document.getElementById('kgMaking').value)||0;
  if(!karigId)return toast('Select a karigar','err');
  if(!wt||!desc)return toast('Enter weight and description','err');
  if(!date)return toast('Select issue date','err');
  const jobId='KG-'+td().replace(/-/g,'').slice(2)+(S.karigar||[]).length.toString().padStart(3,'0');
  if(!S.karigar)S.karigar=[];
  // FIX AE-02: Deduct gold from bulk stock when issued to karigar
  const kgSource=document.getElementById('kgBulkSrc')?.value||'';
  let kgSourceItem=null;
  if(kgSource&&S.items[kgSource]){
    kgSourceItem=S.items[kgSource];
    if((kgSourceItem.remainingWeight||0)<wt-0.001)return toast(`Not enough weight in ${kgSource}. Available: ${(kgSourceItem.remainingWeight||0).toFixed(3)}g`,'err');
    kgSourceItem.remainingWeight=Math.max(0,(kgSourceItem.remainingWeight||0)-wt);
    if(kgSourceItem.remainingWeight<=0.001)kgSourceItem.status='Sold';
  }
  S.karigar.push({jobId,karigId,metal,issueDate:date,metalGiven:wt,purity,description:desc,expectedReturn:exp,makingCharges:making,status:'issued',metalReturned:null,returnDate:null,makingPaid:0,sourceItemId:kgSource||null});
  aLog('CREATE','KarigarJob',jobId,`Issued ${wt}g ${metal} to ${S.vendors[karigId]?.name}${kgSource?' from item '+kgSource:''}`);
  save();toast(`✅ ${jobId} issued — ${wt}g ${metal} to ${S.vendors[karigId]?.name}${kgSourceItem?' | Deducted from '+kgSource:'⚠️ Remember to deduct from stock manually'}`);PAGES['karigar']();
}
function kgReceive(jobId){
  const j=(S.karigar||[]).find(x=>x.jobId===jobId);
  if(!j)return toast('Job not found','err');
  const retWt=parseFloat(document.getElementById('kgRet_'+jobId)?.value)||0;

  const mkMode=document.getElementById('kgMkMode_'+jobId)?.value||'cash';
  if(!retWt)return toast('Enter returned weight','err');

  j.metalReturned=retWt;j.returnDate=td();j.makingPaid=mkPaid;j.status='done';
  if(mkPaid>0)flowOut(td(),mkPaid,mkMode,'karigar_making','Making charges to '+S.vendors[j.karigId]?.name+' for '+jobId,j.metal||'Gold');
  aLog('UPDATE','KarigarJob',jobId,`Received back ${retWt}g. Wastage: ${(j.metalGiven-retWt).toFixed(3)}g. Making: ₹${mkPaid}`);
  save();
  toast(`✅ ${jobId} received back! Wastage: ${(j.metalGiven-retWt).toFixed(3)}g`);
  // FIX FD-01: Prompt to create finished item in stock immediately
  const kgCats=Object.values(S.products).filter(p=>p.metal===j.metal);

        roundedPct:pct(cat.purity)||.92,weight:retWt,remainingWeight:retWt,

        // Link item to customer order — reserved for this customer
        customOrderId:j.customOrderId||null,
        reservedForCustomer:linkedCustId||null};
      j.finishedItemId=finId;
      // Auto-link to custom order and set status to ready
      if(linkedOrder){
        linkedOrder.finishedItemId=finId;
        linkedOrder.status='ready';

        linkedOrder.statusHistory.push({date:td(),status:'ready',note:'Item '+finId+' added from karigar job '+jobId});
        aLog('UPDATE','CustomOrder',linkedOrder.id,'Ready — Item '+finId+' linked from karigar '+jobId);
        toast('✅ '+finId+' added to stock & linked to order '+linkedOrder.id+' for '+linkedOrder.custName+'. Order is now READY.');
      } else {

      save();PAGES['karigar']();

  PAGES['karigar']();

// #15 Seasonal Trends
function anSeasL(){
  const months=[];const now=new Date();
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({key:d.getFullYear()+'-'+p2(d.getMonth()+1),label:MO[d.getMonth()]+' '+d.getFullYear().toString().slice(2),rev:0,count:0,profit:0});
  }
  Object.values(S.invoices).filter(i=>i.status!=='returned').forEach(inv=>{
    const m=months.find(x=>x.key===(inv.date||'').slice(0,7));
    if(m){m.rev+=inv.received||0;m.count++;m.profit+=inv.replProfit||0;}
  });
  const maxRev=Math.max.apply(null,[1].concat(months.map(m=>m.rev)));
  const BH=110;
  const el=document.getElementById('anSeasOut');if(!el)return;
  const barHtml=months.map(m=>{
    const h=Math.max(4,Math.round(m.rev/maxRev*BH));
    const isCur=m.key===td().slice(0,7);
    return '<div style="display:flex;flex-direction:column;align-items:center;min-width:50px;flex:1">'+
      '<div style="font-size:.6rem;color:var(--mu);margin-bottom:3px">'+(m.rev>0?fr(m.rev).replace('₹',''):'')+'</div>'+
      '<div style="height:'+h+'px;width:100%;background:'+(isCur?'var(--gold)':'var(--gd)')+';border-radius:3px 3px 0 0;opacity:'+(m.rev>0?1:.2)+'" title="'+m.label+': '+fr(m.rev)+'"></div>'+
      '<div style="font-size:.6rem;color:var(--mu);margin-top:4px;text-align:center">'+m.label+'</div>'+
      '<div style="font-size:.58rem;color:var(--mu)">'+m.count+'</div></div>';
  }).join('');
  const withRev=months.filter(m=>m.rev>0);
  const best=withRev.length?withRev.reduce((a,b)=>b.rev>a.rev?b:a):null;
  const worst=withRev.length?withRev.reduce((a,b)=>b.rev<a.rev?b:a):null;
  el.innerHTML='<div class="card"><div class="ct">📅 Monthly Revenue — Last 12 Months</div>'+
    '<div style="display:flex;align-items:flex-end;gap:5px;height:'+(BH+46)+'px;padding:8px 0 0;overflow-x:auto">'+barHtml+'</div></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">'+
    '<div class="card"><div class="ct">📈 Best Month</div>'+
    (best?'<div style="text-align:center;padding:10px"><div style="font-size:1.4rem;font-weight:700;color:var(--gold)">'+best.label+'</div><div class="tsc" style="font-size:1.05rem;margin-top:4px">'+fr(best.rev)+'</div><div class="tm" style="font-size:.75rem">'+best.count+' sales</div></div>':'<div class="empty" style="padding:14px"><div class="ei">📊</div><p>Not enough data</p></div>')+
    '</div>'+
    '<div class="card"><div class="ct">📉 Slowest Month</div>'+
    (worst&&worst!==best?'<div style="text-align:center;padding:10px"><div style="font-size:1.4rem;font-weight:700;color:var(--wa)">'+worst.label+'</div><div class="twa" style="font-size:1.05rem;margin-top:4px">'+fr(worst.rev)+'</div><div class="tm" style="font-size:.75rem">'+worst.count+' sales</div></div>':'<div class="empty" style="padding:14px"><div class="ei">📊</div><p>Not enough data</p></div>')+
    '</div></div>'+
    tbl(['Month','Sales','Revenue','Profit','Avg/Sale'],
      months.slice().reverse().map(m=>[m.label,m.count,fr(m.rev),'<span class="'+(m.profit>=0?'tsc':'ter')+'">'+fr(m.profit)+'</span>',m.count>0?fr(m.rev/m.count):'—']));
}

// #16 Karigar Wastage
function anKarL(){
  const jobs=(S.karigar||[]).filter(j=>j.status==='done'&&j.metalReturned!=null);
  const bk={};
  jobs.forEach(j=>{
    const n=S.vendors[j.karigId]?S.vendors[j.karigId].name:j.karigId;
    if(!bk[j.karigId])bk[j.karigId]={name:n,jobs:0,given:0,returned:0,wastage:0,making:0};
    bk[j.karigId].jobs++;bk[j.karigId].given+=j.metalGiven||0;
    bk[j.karigId].returned+=j.metalReturned||0;
    bk[j.karigId].wastage+=(j.metalGiven||0)-(j.metalReturned||0);
    bk[j.karigId].making+=j.makingPaid||0;
  });
  const sorted=Object.values(bk).sort((a,b)=>(b.given>0?b.wastage/b.given:0)-(a.given>0?a.wastage/a.given:0));
  const tG=jobs.reduce((s,j)=>s+(j.metalGiven||0),0);
  const tR=jobs.reduce((s,j)=>s+(j.metalReturned||0),0);
  const tW=tG-tR;
  const rate=S.rates[td()];
  const wVal=tW*(rate?rate.pureGold:0);
  const el=document.getElementById('anKarOut');if(!el)return;
  el.innerHTML='<div class="kg">'+
    '<div class="kc"><div class="kl">Completed Jobs</div><div class="kv">'+jobs.length+'</div></div>'+
    '<div class="kc"><div class="kl">Total Gold Given</div><div class="kv twa">'+tG.toFixed(3)+'g</div></div>'+
    '<div class="kc"><div class="kl">Total Returned</div><div class="kv tsc">'+tR.toFixed(3)+'g</div></div>'+
    '<div class="kc"><div class="kl">Total Wastage</div><div class="kv ter">'+tW.toFixed(3)+'g</div>'+(rate?'<div class="ks">~'+fr(wVal)+'</div>':'')+'</div>'+
    '<div class="kc gb"><div class="kl">Avg Wastage %</div><div class="kv '+(tG>0&&tW/tG>0.03?'ter':'tsc')+'">'+(tG>0?(tW/tG*100).toFixed(2):0)+'%</div></div>'+
    '</div>'+
    (sorted.length?tbl(['Karigar','Jobs','Given','Returned','Wastage','Wastage %','Making Paid'],
      sorted.map(k=>{const wp=k.given>0?(k.wastage/k.given*100):0;
        return[k.name,k.jobs,k.given.toFixed(3)+'g',k.returned.toFixed(3)+'g',
          '<span class="ter fw">'+k.wastage.toFixed(3)+'g</span>',
          '<span class="'+(wp>3?'ter':wp>1.5?'twa':'tsc')+' fw">'+wp.toFixed(2)+'%</span>',
          fr(k.making)];})):
      '<div class="empty"><div class="ei">🔨</div><p>No completed karigar jobs yet</p></div>')+
    tbl(['Job','Karigar','Issued','Returned','Given','Returned Wt','Wastage','Wastage %'],
      jobs.sort((a,b)=>b.returnDate.localeCompare(a.returnDate)).slice(0,20).map(j=>{
        const w=(j.metalGiven||0)-(j.metalReturned||0);const wp=j.metalGiven>0?(w/j.metalGiven*100):0;
        return['<span class="tg">'+j.jobId+'</span>',S.vendors[j.karigId]?S.vendors[j.karigId].name:j.karigId,
          fmt(j.issueDate),fmt(j.returnDate),j.metalGiven.toFixed(3)+'g',j.metalReturned.toFixed(3)+'g',
          '<span class="ter">'+w.toFixed(3)+'g</span>',
          '<span class="'+(wp>3?'ter':wp>1.5?'twa':'tsc')+'">'+wp.toFixed(2)+'%</span>'];}));
}

function gsCollect(id,type){
  var s=(S.goldSchemes||[]).find(function(x){return x.id===id;});if(!s)return;
  if(type==='missed'){
    // Mark missed — no cash movement
    s.payments.push({date:td(),type:'missed',amount:0,month:s.payments.length+1});
    aLog('MISS','GoldScheme',id,'Month '+s.payments.length+' missed');
    save();toast('⏭ Month '+s.payments.length+' marked missed');gsRender();
    return;
  }
  // FIX 3 — Manual amount input for every collection (fixed shows default, flexible is free)
  var suggested=s.monthlyAmt||0;
  var isFlexible=(s.schemeType==='flexible');
  modal('💰 Collect — '+s.schemeName,
    '<div class="al aok" style="margin-bottom:10px">Customer: <strong>'+s.custName+'</strong>'+(isFlexible?' | <span style="color:var(--gd)">Flexible Scheme</span>':'')+'</div>'+
    '<div class="fg"><label>'+(isFlexible?'Amount Received (₹) — customer can pay any amount':'Amount (₹) — edit if different from monthly')+' *</label>'+
    '<input type="number" id="gsCollAmt" step="0.01" value="'+(suggested||'')+'" placeholder="Enter amount received" style="font-size:1.1rem;font-weight:700"></div>'+
    '<div class="fg"><label>Date</label><input type="date" id="gsCollDate" value="'+td()+'"></div>'+
    '<div class="fg"><label>Payment Mode</label>'+
    '<select id="gsCollMode">'+
    '<option value="cash">💵 Cash</option>'+
    '<option value="upi">📱 UPI</option>'+
    '<option value="card">💳 Card</option>'+
    '<option value="cheque">🏦 Cheque</option>'+
    '</select></div>'+
    (suggested&&!isFlexible?'<div class="al ai" style="font-size:.74rem">Monthly target: '+fr(suggested)+' — change if customer paid partial or extra</div>':''),
    function(){
      var amt=parseFloat(document.getElementById('gsCollAmt')?.value)||0;
      var cDate=document.getElementById('gsCollDate')?.value||td();
      var cMode=document.getElementById('gsCollMode')?.value||'cash';
      if(!amt||amt<=0)return toast('Enter amount received','err');
      var monthNo=s.payments.filter(function(p){return p.type==='paid';}).length+1;
      s.payments.push({date:cDate,type:'paid',amount:amt,month:monthNo,mode:cMode});
      s.totalCollected=(s.totalCollected||0)+amt;
      // Update totalValue for flexible schemes based on actual collections
      if(isFlexible)s.totalValue=s.totalCollected;
      flowIn(cDate,amt,cMode,'scheme_collection',id+' month '+monthNo+' from '+s.custName,'Gold');
      aLog('COLLECT','GoldScheme',id,'Month '+monthNo+' | '+fr(amt)+' | '+cMode);
      save();toast('✅ '+fr(amt)+' collected for '+id+' (month '+monthNo+')');gsRender();
    },'✅ Confirm Collection');
}
function gsCancel(id){
  // FIX — Option C: Ask how much to refund on cancellation
  var s=(S.goldSchemes||[]).find(function(x){return x.id===id;});if(!s)return;
  var totalColl=(s.totalCollected||s.payments.filter(function(p){return p.type==='paid';}).reduce(function(a,p){return a+p.amount;},0));
  modal('❌ Cancel Scheme — '+id,
    '<div class="al ae" style="margin-bottom:10px">Cancelling scheme for <strong>'+s.custName+'</strong></div>'+
    '<div class="sbox" style="margin-bottom:10px">'+
    '<div class="sr2"><span class="tm">Total Collected from Customer</span><span class="fw tsc">'+fr(totalColl)+'</span></div>'+
    '</div>'+
    '<div class="fg"><label>Refund Amount (₹) — how much will you return to customer?</label>'+
    '<input type="number" id="gsCancelRefund" step="0.01" value="'+totalColl+'" placeholder="0 = no refund, full amount = full refund"></div>'+
    '<div class="fg"><label>Refund Mode</label>'+
    '<select id="gsCancelMode"><option value="cash">💵 Cash</option><option value="upi">📱 UPI</option><option value="card">💳 Card</option></select></div>'+
    '<div class="fg"><label>Cancellation Note</label><input type="text" id="gsCancelNote" placeholder="Reason or note"></div>'+
    '<div class="al ai" style="font-size:.73rem">If refund = 0, cash stays with shop. Cash register will be reduced by refund amount.</div>',
    function(){
      var refund=parseFloat(document.getElementById('gsCancelRefund')?.value)||0;
      var rMode=document.getElementById('gsCancelMode')?.value||'cash';
      var rNote=document.getElementById('gsCancelNote')?.value||'Scheme cancelled';
      s.status='cancelled';s.cancelDate=td();s.cancelNote=rNote;s.refundAmt=refund;
      // Reduce cash register by refund amount
      if(refund>0.01){
        flowOut(td(),refund,rMode,'scheme_refund','Refund for cancelled scheme '+id+' to '+s.custName,'Gold');
        toast('✅ Scheme cancelled. ₹'+refund.toFixed(2)+' refunded via '+rMode+' — cash register updated.');
      }else{
        toast('✅ Scheme cancelled. No refund given — cash stays with shop.');
      }
      aLog('UPDATE','GoldScheme',id,'CANCELLED | Refund: '+fr(refund)+' | '+rNote);
      save();gsRender();
    },'❌ Confirm Cancellation',true);
}
function gsRedeem(id){
  var s=(S.goldSchemes||[]).find(function(x){return x.id===id;});if(!s)return;
  var custInvs=Object.values(S.invoices).filter(function(i){
    return i.customerId===s.customerId&&i.status!=='returned';
  }).sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,15);
  var invOpts=custInvs.map(function(i){
    return '<option value="'+i.invoiceId+'">'+i.invoiceId+' — '+fmt(i.date)+' — '+fr(i.received)+'</option>';
  }).join('');
  modal('Redeem Gold Scheme — '+id,
    '<p style="margin-bottom:8px">Customer: <strong>'+s.custName+'</strong></p>'+
    '<p style="margin-bottom:10px">Scheme value: <strong>'+fr(s.totalValue)+'</strong> — select the invoice to link this redemption.</p>'+
    '<div class="fg"><label>Select Invoice *</label>'+
    '<select id="gsRedInv">'+
    (custInvs.length?'<option value="">— Select Invoice —</option>'+invOpts:'<option value="">No invoices found — create billing invoice first</option>')+
    '</select></div>'+
    '<div class="al ai" style="margin-top:8px;font-size:.75rem">Monthly collections are already in your Cash Register. This just marks the scheme as used against an invoice for your records.</div>',
    function(){
      var inv=document.getElementById('gsRedInv')?document.getElementById('gsRedInv').value.trim():'';
      if(!inv)return toast('Select an invoice','err');
      s.status='redeemed';s.redeemedInvoice=inv;s.redemptionDate=td();
      if(S.invoices[inv]){
        if(!S.invoices[inv].schemeRedemptions)S.invoices[inv].schemeRedemptions=[];
        S.invoices[inv].schemeRedemptions.push({schemeId:id,amount:s.totalValue,date:td()});
        // FIX BUG-06: Update inv.received so invoice balance reduces correctly in reports
        // Monthly collections are already in register — this just marks the invoice as settled
        if(!S.invoices[inv].schemePayment)S.invoices[inv].schemePayment=0;
        S.invoices[inv].schemePayment=(S.invoices[inv].schemePayment||0)+s.totalValue;
        // Update received to reflect scheme payment applied
        const netPay=S.invoices[inv].netPayable||S.invoices[inv].quoted||0;
        const alreadyReceived=S.invoices[inv].received||0;
        const schemeApplied=Math.min(s.totalValue, Math.max(0, netPay-alreadyReceived));
        if(schemeApplied>0.01){
          S.invoices[inv].received=alreadyReceived+schemeApplied;
        }
        toast('✅ Scheme value '+fr(s.totalValue)+' applied to invoice '+inv+'. Invoice balance updated. Monthly collections were already in register.');
      }
      aLog('REDEEM','GoldScheme',id,'Invoice: '+inv+' | Value: '+fr(s.totalValue));
      save();toast('✅ Scheme '+id+' redeemed against '+inv);gsRender();
    },'Confirm Redemption');
}

function coSt(id,status){
  var o=(S.customOrders||[]).find(function(x){return x.id===id;});if(!o)return;
  o.status=status;o.statusHistory=o.statusHistory||[];
  o.statusHistory.push({date:td(),status:status,note:''});
  aLog('UPDATE','CustomOrder',id,'→ '+status);
  // AUTO-CREATE karigar job when order starts (if karigar assigned and no job yet)
  if(status==='in_progress'&&o.karigId&&!(S.karigar||[]).find(function(j){return j.customOrderId===id;})){
    if(!S.karigar)S.karigar=[];
    var jobId='KG-'+td().replace(/-/g,'').slice(2)+'CO'+S.karigar.length.toString().padStart(2,'0');
    S.karigar.push({
      jobId:jobId,
      karigId:o.karigId,
      metal:o.metal||'Gold',
      issueDate:td(),
      metalGiven:o.approxWeight||0,
      purity:91.6,
      description:'[Custom Order: '+id+'] '+o.description,
      expectedReturn:o.deliveryDate||addDays(td(),14),
      makingCharges:0,
      status:'issued',
      metalReturned:null,
      returnDate:null,
      makingPaid:0,
      sourceItemId:null,
      customOrderId:id  // LINK to custom order
    });
    aLog('CREATE','KarigarJob',jobId,'Auto from Custom Order '+id);
    toast('✅ Karigar job '+jobId+' auto-created for '+id+' → Go to Karigar Work to track progress');
  }
  save();toast('✅ '+id+' → '+status);
  // When order marked 'ready', prompt to add finished item to stock
  if(status==='ready'){
    // Check if a karigar job exists for this order
    var kJob=(S.karigar||[]).find(function(j){return j.customOrderId===id;});
    var kJobDone=kJob&&kJob.status==='done'&&kJob.finishedItemId;
    if(!kJobDone){
      // No karigar finished item yet — prompt to create one
      var cats=Object.values(S.products).filter(function(p){return p.metal===(o.metal||'Gold');});

function wrGetData(filterFn){
  // Returns {catCode: {bought:g, sold:g}} for items matching filterFn on date
  const bought={};
  const sold={};

  // BOUGHT: from items — entryDate in range, source must be 'purchase' only (not opening_stock)
  Object.values(S.items||{}).forEach(function(item){
    if((item.source||'')!=='purchase')return;
    if(!filterFn(item.entryDate||''))return;
    const cc=item.catCode||'';
    if(!cc)return;
    const wt=parseFloat(item.weight)||0;
    if(!bought[cc])bought[cc]=0;
    bought[cc]+=wt;
  });

  // SOLD: from invoices — date in range
  Object.values(S.invoices||{}).forEach(function(inv){
    if(inv.status==='returned')return;
    if(!filterFn(inv.date||''))return;
    (inv.items||[]).forEach(function(it){
      const cc=it.itemId?(S.items[it.itemId]||{}).catCode||wrGuessCat(it.itemId):'';
      if(!cc)return;
      const wt=parseFloat(it.isBulk?it.sellWt:it.weight)||0;
      if(!sold[cc])sold[cc]=0;
      sold[cc]+=wt;
    });
  });

  return {bought,sold};
}

function wrGuessCat(itemId){
  // itemId like GGR0001 → catCode = GGR
  if(!itemId)return '';
  return itemId.replace(/\d+$/,'');
}

function wrCurrentStock(catCode){
  // Sum remainingWeight of available items in this category
  let g=0;
  Object.values(S.items||{}).forEach(function(item){
    if((item.catCode||'')!==catCode)return;
    if(item.status==='Sold')return;
    g+=parseFloat(item.isBulk?(item.remainingWeight||item.weight):item.weight)||0;
  });
  return g;
}

function wrRender(){
  const selMonth=document.getElementById('wrMonth')?.value||td().slice(0,7);
  const selYear=document.getElementById('wrYear')?.value||td().slice(0,4);

  // Month filter
  const monthFilter=function(date){return (date||'').slice(0,7)===selMonth;};
  // Year filter
  const yearFilter=function(date){return (date||'').slice(0,4)===String(selYear);};

  const mData=wrGetData(monthFilter);
  const yData=wrGetData(yearFilter);

  // Split products by metal
  const goldCats=[];const silverCats=[];
  Object.values(S.products||{}).forEach(function(p){
    if(p.metal==='Gold')goldCats.push(p);
    else if(p.metal==='Silver')silverCats.push(p);
  });
  goldCats.sort(function(a,b){return (a.categoryName||'').localeCompare(b.categoryName||'');});
  silverCats.sort(function(a,b){return (a.categoryName||'').localeCompare(b.categoryName||'');});

  wrRenderMetal('Gold',goldCats,mData,yData,selMonth,selYear);

}

function wrRenderMetal(metal,cats,mData,yData,selMonth,selYear){
  const tblId=metal==='Gold'?'wrGoldTable':'wrSilverTable';
  const totId=metal==='Gold'?'wrGoldTotals':'wrSilverTotals';
  const tblEl=document.getElementById(tblId);
  const totEl=document.getElementById(totId);
  if(!tblEl||!totEl)return;

  const thresholds=S.weightThresholds||{};
  let totalStock=0,totalBoughtM=0,totalSoldM=0,totalBoughtY=0,totalSoldY=0;
  let totalThresh=0,belowCount=0;

  const fg3=function(n){return n?n.toFixed(3)+'g':'—';};

  let rows='';
  cats.forEach(function(p){
    const cc=p.catCode;
    const stockWt=wrCurrentStock(cc);
    const thresh=parseFloat((thresholds[cc]||{})[metal.toLowerCase()])||0;
    const boughtM=mData.bought[cc]||0;
    const soldM=mData.sold[cc]||0;
    const boughtY=yData.bought[cc]||0;
    const soldY=yData.sold[cc]||0;

    totalStock+=stockWt;
    totalBoughtM+=boughtM;totalSoldM+=soldM;
    totalBoughtY+=boughtY;totalSoldY+=soldY;
    if(thresh>0)totalThresh+=thresh;

    // Status
    let statusBadge='';
    if(thresh>0){
      if(stockWt<=0){statusBadge='<span class="b2 ber">OUT OF STOCK</span>';belowCount++;}
      else if(stockWt<thresh){statusBadge='<span class="b2 ber">🔴 LOW</span>';belowCount++;}
      else if(stockWt<thresh*1.2){statusBadge='<span class="b2" style="background:#e67e22;color:#fff">🟡 OK</span>';}
      else{statusBadge='<span class="b2 bsc">🟢 GOOD</span>';}
    }else{
      statusBadge='<span class="b2 bin" style="font-size:.6rem">No threshold</span>';
    }

    const stockColor=thresh>0&&stockWt<thresh?'color:#c0392b;font-weight:700':'color:#0F3D2E;font-weight:600';

    rows+=`<tr>
      <td><span style="font-weight:600">${p.categoryName||cc}</span><br><span style="font-size:.65rem;color:var(--mu)">${cc}</span></td>
      <td style="${stockColor}">${fg3(stockWt)}</td>
      <td>${thresh>0?fg3(thresh):'<span style="color:#aaa;font-size:.75rem">—</span>'}</td>
      <td>${statusBadge}</td>
      <td style="color:#1a7a4a">${fg3(boughtM)}</td>
      <td style="color:#c0392b">${fg3(soldM)}</td>
      <td style="color:#1a7a4a">${fg3(boughtY)}</td>
      <td style="color:#c0392b">${fg3(soldY)}</td>
    </tr>`;
  });

  if(!cats.length){
    tblEl.innerHTML='<div class="empty"><div class="ei">${metal==="Gold"?"🥇":"🥈"}</div><p>No ${metal} categories found</p></div>';
    return;
  }

  tblEl.innerHTML=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.78rem">
    <thead><tr style="background:rgba(0,0,0,.04)">
      <th style="text-align:left;padding:7px 6px">Category</th>
      <th style="text-align:right;padding:7px 6px">Current Stock</th>
      <th style="text-align:right;padding:7px 6px">Min Threshold</th>
      <th style="text-align:center;padding:7px 6px">Status</th>
      <th style="text-align:right;padding:7px 6px;color:#1a7a4a">Bought (Month)</th>
      <th style="text-align:right;padding:7px 6px;color:#c0392b">Sold (Month)</th>
      <th style="text-align:right;padding:7px 6px;color:#1a7a4a">Bought (Year)</th>
      <th style="text-align:right;padding:7px 6px;color:#c0392b">Sold (Year)</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;

  // Totals bar
  const mn=selMonth;const yr=selYear;
  totEl.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:.78rem">
      <div><div style="color:var(--mu);font-size:.68rem;margin-bottom:2px">TOTAL STOCK</div><div style="font-weight:700;font-size:1rem;color:#0F3D2E">${totalStock.toFixed(3)}g</div></div>
      <div><div style="color:var(--mu);font-size:.68rem;margin-bottom:2px">BELOW THRESHOLD</div><div style="font-weight:700;font-size:1rem;color:${belowCount>0?'#c0392b':'#1a7a4a'}">${belowCount} ${belowCount===1?'category':'categories'}</div></div>
      <div><div style="color:var(--mu);font-size:.68rem;margin-bottom:2px">BOUGHT THIS MONTH</div><div style="font-weight:700;color:#1a7a4a">${totalBoughtM.toFixed(3)}g</div></div>
      <div><div style="color:var(--mu);font-size:.68rem;margin-bottom:2px">SOLD THIS MONTH</div><div style="font-weight:700;color:#c0392b">${totalSoldM.toFixed(3)}g</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:.78rem;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.1)">
      <div><div style="color:var(--mu);font-size:.68rem;margin-bottom:2px">BOUGHT THIS YEAR (${yr})</div><div style="font-weight:700;color:#1a7a4a">${totalBoughtY.toFixed(3)}g</div></div>
      <div><div style="color:var(--mu);font-size:.68rem;margin-bottom:2px">SOLD THIS YEAR (${yr})</div><div style="font-weight:700;color:#c0392b">${totalSoldY.toFixed(3)}g</div></div>
    </div>`;
}

      <div>
        <div style="font-weight:700;font-size:.78rem;margin-bottom:6px;color:var(--gd)">🥇 Gold (grams)</div>

        </table>
      </div>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn bsc bsm" onclick="wrRender()">✅ Done Editing</button>
      <span id="wrSaveStatus" style="font-size:.73rem;color:#1a7a4a;align-self:center"></span>
    </div>`;
}

function wrSaveThresh(){
  if(!S.weightThresholds)S.weightThresholds={};
  // Gold thresholds
  Object.values(S.products||{}).forEach(function(p){
    const cc=p.catCode;
    if(p.metal==='Gold'){
      const el=document.getElementById('wt_g_'+cc);
      if(el){
        const v=parseFloat(el.value)||0;
        if(!S.weightThresholds[cc])S.weightThresholds[cc]={};
        S.weightThresholds[cc].gold=v;
      }
    } else if(p.metal==='Silver'){
      const el=document.getElementById('wt_s_'+cc);
      if(el){
        const v=parseFloat(el.value)||0;
        if(!S.weightThresholds[cc])S.weightThresholds[cc]={};
        S.weightThresholds[cc].silver=v;
      }
    }
  });
  save();
  const st=document.getElementById('wrSaveStatus');
  if(st){st.textContent='✅ Saved';setTimeout(function(){if(st)st.textContent='';},1500);}
  // Re-render tables with new thresholds
  wrRender();
}

var _origGst_bak=PAGES['gst-history'];
PAGES['gst-history']=function(){
  _origGst_bak();
  var pg=document.getElementById('pg');if(!pg)return;
  // FIX G-05: Add month-wise GST summary before export section
  var gMon=document.createElement('div');gMon.className='card';gMon.style.marginTop='12px';
  var allGstInvs=Object.values(S.invoices).filter(function(i){return i.invoiceType==='gst'&&i.status!=='returned';});
  var monMap={};
  allGstInvs.forEach(function(inv){
    var m=inv.date.slice(0,7);
    if(!monMap[m])monMap[m]={month:m,count:0,metal:0,making:0,cgst:0,sgst:0,total:0};
    var mk=(inv.items||[]).reduce(function(s,it){return s+(it.makingCharged||it.makingAmt||0);},0);
    // FIX BUG-13: Use full taxable value (netPayable), not just cash collected (received)
    var taxableBase=Math.max(0,(inv.netPayable||inv.quoted||inv.received||0));
    var metal=Math.max(0,taxableBase-mk);
    var cgst=metal*0.015+mk*0.025;
    monMap[m].count++;monMap[m].metal+=metal;monMap[m].making+=mk;monMap[m].cgst+=cgst;monMap[m].sgst+=cgst;monMap[m].total+=taxableBase;
  });
  var monRows=Object.values(monMap).sort(function(a,b){return b.month.localeCompare(a.month);});
  gMon.innerHTML='<div class="ct">📅 Month-wise GST Summary (for GSTR-3B filing)</div>'+
    '<div class="al ai" style="margin-bottom:10px;font-size:.76rem">Use these figures for GSTR-3B: Report CGST and SGST separately per month. Input GST from purchases can be offset against output GST.</div>'+
    (monRows.length?tbl(
      ['Month','GST Bills','Metal Taxable','Making Taxable','CGST (1.5%+2.5%)','SGST (1.5%+2.5%)','Total Output'],
      monRows.map(function(m){
        return [m.month,m.count,fr(m.metal),fr(m.making),
          '<span class="twa fw">'+fr(m.cgst)+'</span>',
          '<span class="twa fw">'+fr(m.sgst)+'</span>',
          fr(m.total)];
      })):
    '<div class="tm" style="padding:12px">No GST invoices yet.</div>');
  pg.appendChild(gMon);
  var g=document.createElement('div');g.className='card';g.style.marginTop='12px';
  g.innerHTML='<div class="ct">📤 GSTR-1 Export — HSN 7113 (Jewellery)</div>'+
    '<div class="al ai" style="margin-bottom:10px;font-size:.76rem">Metal value @ 3% GST (1.5% CGST + 1.5% SGST) | Making charges @ 5% GST (2.5% CGST + 2.5% SGST) | B2C sales</div>'+
    '<div style="display:flex;gap:9px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap">'+
    '<div class="fg"><label>From</label><input type="date" id="gstrFrom" value="'+td().slice(0,7)+'-01'+'"></div>'+
    '<div class="fg"><label>To</label><input type="date" id="gstrTo" value="'+td()+'"></div>'+
    '<button class="btn bp" onclick="gstrExp()">📥 Download CSV</button>'+
    '<button class="btn bg2" onclick="gstrPrev()">👁 Preview</button>'+
    '</div><div id="gstrPrevOut"></div>';
  pg.appendChild(g);
};
function gstrCalcRows(from,to){
  return Object.values(S.invoices).filter(function(i){return i.invoiceType==='gst'&&i.date>=from&&i.date<=to&&i.status!=='returned';}).map(function(inv){
    var mk=(inv.items||[]).reduce(function(s,it){return s+(it.makingCharged||it.makingAmt||0);},0);
    // FIX BUG-13: GST base = full taxable value at time of supply (netPayable), not cash received
    var taxableBase=Math.max(0,(inv.netPayable||inv.quoted||inv.received||0));
    var metal=Math.max(0,taxableBase-mk);
    var cgst=metal*0.015+mk*0.025;
    var sgst=cgst;
    return {invId:inv.invoiceId,date:inv.date,custName:inv.custName||'Consumer',custPhone:inv.customerPhone||'',metal:metal,mk:mk,taxable:metal+mk,cgst:cgst,sgst:sgst,total:metal+mk+cgst+sgst};
  });
}
function gstrPrev(){
  var from=document.getElementById('gstrFrom')?document.getElementById('gstrFrom').value:'';
  var to=document.getElementById('gstrTo')?document.getElementById('gstrTo').value:'';
  var rows=gstrCalcRows(from,to);
  var el=document.getElementById('gstrPrevOut');if(!el)return;
  if(!rows.length){el.innerHTML='<div class="al aw" style="margin-top:8px">No GST invoices in this period</div>';return;}
  var totC=rows.reduce(function(s,r){return s+r.cgst;},0);
  el.innerHTML='<div class="tm" style="font-size:.74rem;margin-bottom:7px">'+rows.length+' invoices | CGST: '+fr(totC)+' | SGST: '+fr(totC)+' | Total Tax: '+fr(totC*2)+'</div>'+
    tbl(['Invoice','Date','Customer','Metal Val','Making Val','CGST','SGST','Invoice Total'],
      rows.map(function(r){return ['<span class="tg">'+r.invId+'</span>',fmt(r.date),r.custName,fr(r.metal),fr(r.mk),fr(r.cgst),fr(r.sgst),fr(r.total)];}));
}
function gstrExp(){
  var from=document.getElementById('gstrFrom')?document.getElementById('gstrFrom').value:td().slice(0,7)+'-01';
  var to=document.getElementById('gstrTo')?document.getElementById('gstrTo').value:td();
  var rows=gstrCalcRows(from,to);
  if(!rows.length)return toast('No GST invoices in this period','warn');
  var shop=S.settings;
  var csv='GSTR-1 B2C Sales — '+shop.shopName+'\n';
  csv+='GSTIN: '+(shop.gstNo||'NOT REGISTERED')+' | Period: '+from+' to '+to+'\n\n';
  csv+='Invoice No,Date,Customer,Phone,HSN Code,HSN Description,Metal Taxable (3%),Making Taxable (5%),Total Taxable,CGST,SGST,IGST,Invoice Total\n';
  // FIX G-04: Use correct HSN subcodes per metal
  rows.forEach(function(r){
    // Check if invoice has gold or silver items
    var inv=S.invoices[r.invId];
    var metals=[...new Set((inv?inv.items||[]:[]).map(function(it){return it.metal||'Gold';}))];
    var hasGold=metals.includes('Gold');var hasSilver=metals.includes('Silver');
    // 7113 11 00 = Gold jewellery, 7113 19 00 = Silver jewellery
    var hsnCode=hasGold&&!hasSilver?'71131100':hasSilver&&!hasGold?'71131900':'71131100'; // mixed→gold subcode
    var hsnDesc=hasGold&&!hasSilver?'Gold Jewellery (22K/18K)':hasSilver&&!hasGold?'Silver Jewellery':'Gold/Silver Jewellery';
    csv+=r.invId+','+r.date+',"'+r.custName+'",'+r.custPhone+','+hsnCode+','+'"'+hsnDesc+'",'+r.metal.toFixed(2)+','+r.mk.toFixed(2)+','+r.taxable.toFixed(2)+','+r.cgst.toFixed(2)+','+r.sgst.toFixed(2)+',0.00,'+r.total.toFixed(2)+'\n';
  });
  var totC=rows.reduce(function(s,r){return s+r.cgst;},0);
  var totM=rows.reduce(function(s,r){return s+r.metal;},0);
  var totMk=rows.reduce(function(s,r){return s+r.mk;},0);
  var totTax=rows.reduce(function(s,r){return s+r.taxable;},0);
  var totInv=rows.reduce(function(s,r){return s+r.total;},0);
  csv+='\nTOTALS,,,,,,'+totM.toFixed(2)+','+totMk.toFixed(2)+','+totTax.toFixed(2)+','+totC.toFixed(2)+','+totC.toFixed(2)+',0.00,'+totInv.toFixed(2)+'\n';
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='GSTR1_TAJ_'+from+'_'+to+'.csv';a.click();
  URL.revokeObjectURL(url);
  aLog('EXPORT','GSTR1','','Period: '+from+' to '+to+' | '+rows.length+' invoices');
  toast('✅ GSTR-1 CSV downloaded!');
}
