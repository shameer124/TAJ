function init(){
  currentRole=document.getElementById('lRole')?.value||'owner';
  // Load from IndexedDB first (async), then start app
  loadFromStorage().then(loaded=>{
    if(!loaded){
      // Try to migrate from localStorage if IDB was empty
      migrateToIDB().then(migrated=>{
        if(migrated)toast('✅ Data migrated to IndexedDB (500MB storage). You are all set!','ok');
      });
    }
    _startApp();
  }).catch(()=>{_startApp();});
}

function _startApp(){
  if(S.lastDayClose){
    const lastCloseDate=S.lastDayClose.date;
    const physical=S.lastDayClose.physical||{};
    if(lastCloseDate<td()&&!(S.cashReg[td()]?.openingCash!=null)){
      if(!S.cashReg[td()])S.cashReg[td()]={};
      S.cashReg[td()].openingCash=physical.cash||0;
      S.cashReg[td()].openingUpi=physical.upi||0;
      S.cashReg[td()].openingCard=physical.card||0;
      S.cashReg[td()].openingCheque=physical.cheque||0;
      save();
    }
  }
  buildSB();startClock();updateTopbar();PAGES['dashboard']();
  if(window.innerWidth<=768){setTimeout(fixMobileGrids,80);setBN('dashboard');}
  // BUG-20: Show backup warning banner if last backup > 24 hours ago
  (function checkBackupReminder(){
    const lastBk=S.settings&&S.settings.lastBackupDate;
    const needsBackup=!lastBk||(ddiff(lastBk,td())>=1);
    if(!needsBackup)return;
    if(currentRole!=='owner')return;
    if(document.getElementById('bkBanner'))return;
    const bar=document.createElement('div');
    bar.id='bkBanner';
    bar.style.cssText='position:fixed;top:50px;left:224px;right:0;z-index:998;background:#7A1C1C;color:#FFD0D0;padding:7px 16px;font-size:.78rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #C00000';
    bar.innerHTML='⚠️ No backup taken today! Click Export Backup to save your data. <button class="btn bsm" style="background:#C00000;color:#fff;border:none;cursor:pointer;padding:4px 10px;border-radius:4px;font-size:.72rem" onclick="doBk()">📥 Export Backup Now</button> <button style="background:transparent;border:none;color:#FFD0D0;cursor:pointer;font-size:1rem;padding:0 4px" onclick="document.getElementById(\'bkBanner\').remove()">✕</button>';
    const mainEl=document.getElementById('main');
    if(mainEl)mainEl.insertBefore(bar,mainEl.firstChild);
    const pg=document.getElementById('pg');
    if(pg)pg.style.paddingTop='46px';
  })();
}
// ═══ OLD SILVER FUNCTIONS ══════════════════════════════════
function osvCalc(){
  const w=parseFloat(document.getElementById('osvWt')?.value)||0;
  const pur=parseFloat(document.getElementById('osvPurity')?.value)||0;
  const pureG=pur>0?(w*pur/100):0;
  const rate=S.rates[td()];
  const el=document.getElementById('osvCalcResult');
  if(!el)return;
  if(!w||!pur){el.style.display='none';return;}
  const silverRate=rate?rate.pureSilver:0;
  const mktVal=silverRate?pureG*silverRate:0;
  const suggestPay=mktVal*0.85; // typically pay 80-90% of market to customer
  el.style.display='block';
  el.innerHTML=`<div style="background:rgba(212,175,55,.07);border:1px solid var(--gold);border-radius:6px;padding:10px 12px;font-size:.8rem">
    <div style="color:var(--gold);font-weight:600;margin-bottom:6px">🪙 Old Silver Valuation</div>
    <div style="color:var(--tx)">Pure Weight: <strong>${pureG.toFixed(3)}g</strong> (${w}g × ${pur}%)</div>
    ${silverRate?`<div style="color:var(--tx);margin-top:3px">Market Value @ ₹${fr(silverRate)}/g: <strong class="tsc">${fr(mktVal)}</strong></div>
    <div style="color:var(--mu);margin-top:3px;font-size:.75rem">Suggested Pay (85%): ~${fr(suggestPay)}</div>`:'<div style="color:var(--wa);margin-top:3px">Set today\'s silver rate to see market value</div>'}
  </div>`;
}

function osvRender(){
  const pool=S.oldSilverPool||[];
  const totalG=pool.filter(p=>p.status==='pool').reduce((s,p)=>s+(p.grams||0),0);
  const totalVal=pool.filter(p=>p.status==='pool').reduce((s,p)=>s+(p.agreedValue||0),0);
  const el=document.getElementById('osvPoolDisp');
  if(el){
    if(totalG<=0){
      el.innerHTML='<div class="al aw" style="font-size:.8rem">No silver in pool yet.</div>';
    }else{
      el.innerHTML=`<div class="sbox">
        <div class="sr2 tot"><span>Total in Pool</span><span class="tgo fw">${totalG.toFixed(3)}g</span></div>
        <div class="sr2"><span class="tm" style="font-size:.75rem">Total paid to customers</span><span>${fr(totalVal)}</span></div>
        <div class="sr2"><span class="tm" style="font-size:.75rem">Entries</span><span>${pool.filter(p=>p.status==='pool').length}</span></div>
      </div>`;
    }
  }
  const histEl=document.getElementById('osvHistory');
  if(histEl){
    if(!pool.length){histEl.innerHTML='<div class="empty" style="padding:14px"><p>No old silver transactions yet.</p></div>';return;}
    histEl.innerHTML=tbl(
      ['Date','Source','From','Weight','Purity','Value Paid','Via','Status'],
      [...pool].reverse().map(p=>{
        const srcBadge=p.sourceType==='buy'?'<span class="b2 bwa" style="font-size:.62rem">BUY</span>':p.sourceType==='exchange'?'<span class="b2 bin" style="font-size:.62rem">EXCHANGE</span>':'<span class="b2 bmu" style="font-size:.62rem">COLLECT</span>';
        return[
          fmt(p.date),
          srcBadge,
          p.custName||'—',
          p.grams.toFixed(3)+'g',
          (p.purity||'—')+(p.purity?'%':''),
          fr(p.agreedValue||0),
          (p.mode||'cash').toUpperCase(),
          p.status==='pool'
            ?'<span class="b2 bwa">In Pool</span>'
            :p.status==='given'
              ?`<span class="b2 bok">Given to ${S.vendors[p.vendorId]?.name||'Vendor'}</span>`
              :'<span class="b2 bin">'+p.status+'</span>'
        ];
      }),
      'No transactions'
    );
  }
}

function osvSave(){
  const cust=document.getElementById('osvCust')?.value?.trim()||'Customer';
  const w=parseFloat(document.getElementById('osvWt')?.value)||0;
  const pur=parseFloat(document.getElementById('osvPurity')?.value)||0;
  const val=parseFloat(document.getElementById('osvVal')?.value)||0;
  const mode=document.getElementById('osvMode')?.value||'cash';
  if(w<=0)return toast('Enter weight','err');
  if(val<=0)return toast('Enter agreed value','err');
  // Record in pool
  if(!S.oldSilverPool)S.oldSilverPool=[];
  S.oldSilverPool.push({id:uid(),date:td(),custName:cust,grams:w,purity:pur||null,agreedValue:val,mode,status:'pool'});
  // Cash out to customer
  flowOut(td(),val,mode,'old_silver_buy','Old silver from '+cust+': '+w.toFixed(3)+'g','Silver');
  // Clear form
  ['osvCust','osvWt','osvPurity','osvVal'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  save();toast('✅ '+w.toFixed(3)+'g old silver collected from '+cust);
  osvRender();
}

function osvGiveCalc(){
  const wt=parseFloat(document.getElementById('osvGiveWt')?.value)||0;
  const pur=parseFloat(document.getElementById('osvGivePurity')?.value)||0;
  const rate=parseFloat(document.getElementById('osvGiveRate')?.value)||0;
  const el=document.getElementById('osvGiveDisp');
  if(!el)return;
  if(wt>0&&pur>0&&rate>0){
    const pureG=wt*(pur/100);
    const total=pureG*rate;
    el.innerHTML=`Pure silver: <strong>${pureG.toFixed(3)}g</strong> × ₹${rate.toFixed(2)}/g = <span class="tsc fw">${fr(total)}</span>`;
    el.dataset.total=total;el.dataset.pureG=pureG;
  }else{
    el.innerHTML='Enter weight, purity and rate to see total';
    el.dataset.total=0;el.dataset.pureG=0;
  }
}

function osvGive(){
  const vid=document.getElementById('osvVendor')?.value;
  const wt=parseFloat(document.getElementById('osvGiveWt')?.value)||0;
  const pur=parseFloat(document.getElementById('osvGivePurity')?.value)||0;
  const rate=parseFloat(document.getElementById('osvGiveRate')?.value)||0;
  const payMode=document.getElementById('osvGivePayMode')?.value||'cash';
  if(!vid)return toast('Select vendor','err');
  if(wt<=0)return toast('Enter weight given','err');
  if(pur<=0)return toast('Enter tested purity','err');
  if(rate<=0)return toast('Enter agreed rate','err');
  const pureG=wt*(pur/100);
  const totalAmt=pureG*rate;
  const pool=S.oldSilverPool||[];
  const poolG=pool.filter(p=>p.status==='pool').reduce((s,p)=>s+(p.grams||0),0);
  if(wt>poolG+0.001)return toast(`Only ${poolG.toFixed(3)}g in pool. Cannot give ${wt.toFixed(3)}g`,'err');
  // Mark pool entries as given (FIFO) and stamp vendor info
  const giveId='OSG-'+td().replace(/-/g,'').slice(2)+Math.floor(Math.random()*1000);
  const vname=S.vendors[vid]?.name||vid;
  let remaining=wt;
  const givenEntryIds=[];
  pool.filter(p=>p.status==='pool').forEach(p=>{
    if(remaining<=0)return;
    if(p.grams<=remaining+0.001){
      p.status='given';p.givenDate=td();p.vendorId=vid;p.vendorName=vname;p.giveId=giveId;
      p.testedPurity=pur;p.ratePerPureG=rate;p.payMode=payMode;
      givenEntryIds.push(p.id);remaining-=p.grams;
    }else{
      const split={...p,id:uid(),grams:remaining,status:'given',givenDate:td(),vendorId:vid,vendorName:vname,giveId,testedPurity:pur,ratePerPureG:rate,payMode};
      pool.push(split);givenEntryIds.push(split.id);
      p.grams=p.grams-remaining;remaining=0;
    }
  });
  const vl=getVL(vid);
  // FIX BUG-18: Pre-check vendor silver credit balance before pure_credit settlement
  if(payMode==='pure_credit'){
    const silverBalance=vlSilverDue(vid);
    if(pureG>silverBalance+0.001){
      return toast(`Vendor only has ${silverBalance.toFixed(3)}g pure silver credit. Cannot reduce by ${pureG.toFixed(3)}g. Use cash/UPI instead.`,'err');
    }
  }
  // Record in vendor ledger so it appears in vendor credit sheet
  const silverPayEntry={id:giveId,date:td(),grams:pureG,grossGrams:wt,purity:pur,ratePerPureG:rate,totalValue:totalAmt,method:payMode==='pure_credit'?'pure_credit':payMode,note:`Old silver given: ${wt.toFixed(3)}g gross @ ${pur}% = ${pureG.toFixed(3)}g pure @ ₹${rate.toFixed(2)}/g = ${fr(totalAmt)}`};
  if(payMode==='pure_credit'){
    // Reduces vendor's pure silver credit — negative entry on silverEntries
    vl.silverEntries.push({id:uid(),date:td(),catCode:'OLD_SILVER',grams:-pureG,note:silverPayEntry.note});
    toast(`✅ ${wt.toFixed(3)}g given to ${vname}. ${pureG.toFixed(3)}g pure silver credit reduced.`);
  }else{
    // Vendor pays cash/UPI for the silver — record as silver payment and cash inflow
    vl.silverPayments.push(silverPayEntry);
    flowIn(td(),totalAmt,payMode,'old_silver_give',`Silver to ${vname}: ${wt.toFixed(3)}g @ ${pur}% = ${fr(totalAmt)}`,'Silver');
    toast(`✅ ${wt.toFixed(3)}g given to ${vname}. ${fr(totalAmt)} received via ${payMode.toUpperCase()}.`);
  }
  ['osvGiveWt','osvGivePurity','osvGiveRate'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const disp=document.getElementById('osvGiveDisp');if(disp)disp.innerHTML='';
  save();osvRender();
}

// PWA — PROGRESSIVE WEB APP SUPPORT
// Makes TAJ ERP installable as a real app on phone and laptop
// ═══════════════════════════════════════════════════════════════
(function initPWA(){

  // ── 1. Generate App Icon via Canvas ──────────────────────────
  function makeIcon(size){
    const c=document.createElement('canvas');
    c.width=c.height=size;
    const ctx=c.getContext('2d');
    // Background gradient — dark gold
    const g=ctx.createRadialGradient(size/2,size/2,size*0.1,size/2,size/2,size*0.6);
    g.addColorStop(0,'#1F2937');
    g.addColorStop(1,'#0F172A');
    ctx.fillStyle=g;
    // Rounded rect
    const r=size*0.22;
    ctx.beginPath();
    ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.arcTo(size,0,size,r,r);
    ctx.lineTo(size,size-r);ctx.arcTo(size,size,size-r,size,r);
    ctx.lineTo(r,size);ctx.arcTo(0,size,0,size-r,r);
    ctx.lineTo(0,r);ctx.arcTo(0,0,r,0,r);
    ctx.closePath();ctx.fill();
    // Gold border
    ctx.strokeStyle='#D4AF37';ctx.lineWidth=size*0.04;ctx.stroke();
    // Diamond emoji
    ctx.font=`${size*0.42}px serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('💎',size/2,size*0.42);
    // Shop name
    ctx.fillStyle='#D4AF37';
    ctx.font=`bold ${size*0.13}px Arial`;
    ctx.fillText('TAJ',size/2,size*0.72);
    ctx.fillStyle='#94A3B8';
    ctx.font=`${size*0.09}px Arial`;
    ctx.fillText('JEWELLERY',size/2,size*0.85);
    return c.toDataURL('image/png');
  }

  const icon192=makeIcon(192);
  const icon512=makeIcon(512);

  // ── 2. Set iOS apple-touch-icon dynamically ───────────────────
  const appleLink=document.createElement('link');
  appleLink.rel='apple-touch-icon';
  appleLink.href=icon192;
  document.head.appendChild(appleLink);

  // ── 3. Inject Web App Manifest via data URI ───────────────────
  const manifest={
    name:'TAJ JEWELLERY ERP',
    short_name:'TAJ ERP',
    description:'TAJ Jewellery Shop Management — Railway Kodur, Tirupathi',
    start_url:window.location.href,
    display:'standalone',
    background_color:'#0F172A',
    theme_color:'#D4AF37',
    orientation:'any',
    icons:[
      {src:icon192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
      {src:icon512,sizes:'512x512',type:'image/png',purpose:'any maskable'}
    ]
  };
  const mLink=document.createElement('link');
  mLink.rel='manifest';
  mLink.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(mLink);

  // ── 4. Install prompt (Chrome Android / Desktop Chrome) ───────
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    deferredPrompt=e;
    // Show install button in topbar
    showInstallBtn();
  });

  window.addEventListener('appinstalled',function(){
    deferredPrompt=null;
    const btn=document.getElementById('pwaInstBtn');
    if(btn)btn.remove();
    toast('✅ TAJ ERP installed as App! Open from your home screen.','ok');
    S.settings.pwaInstalled=true;save();
  });

  window.pwaInstall=function(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(r){
        if(r.outcome==='accepted')toast('✅ Installing TAJ ERP app...','ok');
        deferredPrompt=null;
      });
    }else{
      // Show manual instructions
      showInstallGuide();
    }
  };

  function showInstallBtn(){
    if(document.getElementById('pwaInstBtn'))return;
    const tb=document.getElementById('tb');if(!tb)return;
    const btn=document.createElement('button');
    btn.id='pwaInstBtn';
    btn.className='btn bsm';
    btn.style.cssText='background:var(--gold);color:#000;font-weight:700;font-size:.7rem;padding:4px 10px;white-space:nowrap';
    btn.innerHTML='📲 Install App';
    btn.onclick=window.pwaInstall;
    // Insert before the right-side div in topbar
    const right=tb.querySelector('div:last-child');
    if(right)tb.insertBefore(btn,right);
    else tb.appendChild(btn);
  }

  // ── 5. Detect if already running as installed PWA ─────────────
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(isStandalone){
    // Running as installed app — no need to show install banner
    return;
  }

  // ── 6. Show install guide banner after login ──────────────────
  // Only show once per session, and only if not installed
  if(!S.settings?.pwaInstalled&&!sessionStorage.getItem('pwaGuideShown')){
    sessionStorage.setItem('pwaGuideShown','1');
    setTimeout(showInstallBanner,2000);
  }

  function showInstallBanner(){
    if(document.getElementById('pwaBanner'))return;
    const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    const isAndroid=/android/i.test(navigator.userAgent);
    const bar=document.createElement('div');
    bar.id='pwaBanner';
    bar.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:996;background:var(--s1);border:1px solid var(--gold);border-radius:12px;padding:13px 16px;max-width:340px;width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.6);font-size:.78rem';

    let guide='';
    if(isIOS){
      guide=`<div style="font-weight:700;color:var(--gold);margin-bottom:8px">📲 Install TAJ ERP on iPhone/iPad</div>
      <div style="color:var(--tx);line-height:1.9">
        <div>1️⃣ Tap the <strong style="color:var(--gold)">Share</strong> button at the bottom of Safari <span style="font-size:1rem">⬆</span></div>
        <div>2️⃣ Scroll down → tap <strong style="color:var(--gold)">"Add to Home Screen"</strong></div>
        <div>3️⃣ Tap <strong style="color:var(--gold)">Add</strong> — Done! ✅</div>
      </div>`;
    }else if(isAndroid){
      guide=`<div style="font-weight:700;color:var(--gold);margin-bottom:8px">📲 Install TAJ ERP on Android</div>
      <div style="color:var(--tx);line-height:1.9">
        <div>1️⃣ Tap the <strong style="color:var(--gold)">⋮ menu</strong> (3 dots) in Chrome</div>
        <div>2️⃣ Tap <strong style="color:var(--gold)">"Add to Home Screen"</strong></div>
        <div>3️⃣ Tap <strong style="color:var(--gold)">Add</strong> — Done! ✅</div>
        ${deferredPrompt?'<div style="margin-top:8px"><button class="btn bp bfull" onclick="pwaInstall()">📲 Install Now (1 tap)</button></div>':''}
      </div>`;
    }else{
      guide=`<div style="font-weight:700;color:var(--gold);margin-bottom:8px">📲 Install TAJ ERP as Desktop App</div>
      <div style="color:var(--tx);line-height:1.9">
        <div>1️⃣ Click the <strong style="color:var(--gold)">⊕ install icon</strong> in Chrome address bar</div>
        <div>2️⃣ Click <strong style="color:var(--gold)">Install</strong> — Done! ✅</div>
        ${deferredPrompt?'<div style="margin-top:8px"><button class="btn bp bfull" onclick="pwaInstall()">📲 Install Now</button></div>':''}
      </div>`;
    }
    bar.innerHTML=guide+`<div style="display:flex;gap:8px;margin-top:11px">
      <button class="btn bs bsm" style="flex:1" onclick="document.getElementById('pwaBanner').remove()">Maybe Later</button>
      <button class="btn bsm" style="flex:1;background:rgba(212,175,55,.15);color:var(--gold);border:1px solid var(--gd)" onclick="S.settings.pwaInstalled=true;save();document.getElementById('pwaBanner').remove();toast('Got it! You can install from Backup page anytime.')">Don't Show Again</button>
    </div>`;
    document.body.appendChild(bar);
  }

  // Expose for manual trigger from backup page
  window.showInstallGuide=function(){
    const b=document.getElementById('pwaBanner');
    if(b)b.remove();
    setTimeout(showInstallBanner,100);
  };

})();
